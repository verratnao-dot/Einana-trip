<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>妖怪大辞典 | えいなな旅行</title>
<style>
:root{--navy:#122a56;--blue:#255f9b;--gold:#ffd76f;--cream:#fff8e6;--ink:#213a56}
*{box-sizing:border-box}html{min-height:100%;background:#142e59}body{margin:0;min-height:100vh;color:var(--cream);font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN",'Yu Gothic',system-ui,sans-serif;background:radial-gradient(ellipse at 50% 0%,#7ccaf5 0%,#2671ac 26%,#16447a 58%,#0b244a 100%)}
button{font:inherit;cursor:pointer}a{color:inherit;text-decoration:none}.shell{width:min(100%,640px);padding:10px 10px 28px;margin:0 auto}.upper{display:flex;gap:6px;align-items:center;justify-content:space-between;margin-bottom:9px}.nav{flex-shrink:0;background:linear-gradient(#fef0ac,#f1c45b 52%,#c78529);border:2px solid #fff7c9;color:#633d19;box-shadow:0 4px 0 #885317,0 5px 9px #0006;padding:8px 9px;border-radius:20px;font-size:12px;font-weight:900}.brand{font-size:clamp(14px,4.2vw,23px);color:#ffe389;font-weight:1000;text-shadow:1px 2px #704317,0 3px 8px #0009;white-space:nowrap}.frame{padding:9px;border:4px solid #e8b960;border-radius:24px;background:linear-gradient(155deg,#88def9,#316baa 14%,#194d86 49%,#14386c);box-shadow:inset 0 0 0 3px #a9dffc,inset 0 0 0 7px #113769,0 14px 32px #04142ea0}.inner{border:3px solid #85caf1;border-radius:18px;padding:13px 10px 15px;background:linear-gradient(180deg,#20558f,#103468 100%);box-shadow:inset 0 2px 10px #041d4480}.section{display:flex;align-items:center;justify-content:center;margin:0 0 11px;gap:9px}.section:before,.section:after{content:'✦';color:#f9d77b;font-size:14px}.section strong{font-size:clamp(18px,5vw,27px);font-weight:1000;color:#ffebac;letter-spacing:.09em;text-shadow:0 2px #77461b,1px 3px 0 #5d371a}.progress{border:3px solid #96d9f5;background:linear-gradient(#142f5d,#0a2049);border-radius:14px;text-align:center;padding:8px;font-size:13px;box-shadow:inset 0 2px 5px #0005}.progress b{color:#ffe481;font-size:17px}.tabs{display:flex;gap:5px;margin-top:12px;overflow-x:auto;padding-bottom:4px}.tab{white-space:nowrap;border:2px solid #9fd7ec;border-radius:12px 12px 4px 4px;padding:8px 11px;color:#f8fbff;background:linear-gradient(#337bb4,#1a4c83);font-size:12px;font-weight:900}.tab.active{color:#533309;background:linear-gradient(#ffefa6,#eab856);border-color:#fff5c4}.book{margin-top:7px;border:3px solid #efc36c;border-radius:15px;background:linear-gradient(90deg,#132b5b 0%,#285a96 3%,#1b487f 50%,#285a96 97%,#132b5b);padding:10px 9px 12px;box-shadow:inset 0 0 0 2px #95c8df,0 5px 12px #071a3fa0;position:relative}.book:after{content:'';position:absolute;top:9px;bottom:9px;left:50%;width:2px;background:#75a8c24d;pointer-events:none}.bookHeader{display:flex;align-items:center;justify-content:space-between;color:#ffedb5;font-weight:900;font-size:12px;margin:2px 5px 10px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;position:relative}.slot{appearance:none;width:100%;min-width:0;min-height:146px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;padding:7px 3px 8px;border:3px solid #a5d5ec;border-radius:12px;background:linear-gradient(#4181b4,#1c4b80 42%,#10315d);color:#fff;box-shadow:inset 0 2px 0 #f5ffff50,inset 0 -8px 12px #081e4190,0 4px 7px #0005}.slot:active{transform:translateY(2px)}.slot.unowned{border-color:#768ba1;background:linear-gradient(#4c6784,#293e5d 55%,#1d3150)}.medal{width:min(77px,19vw);height:min(77px,19vw);flex:none;border:5px solid #ffedb8;border-radius:50%;position:relative;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 29% 24%,#fffde5,#f9d16b 48%,#aa641c 80%);box-shadow:inset 0 0 0 3px #b87c2b,0 4px 6px #0007}.medal:after{content:'';position:absolute;inset:4px;border-radius:50%;box-shadow:inset 6px 7px 8px #ffffff66,inset -6px -9px 11px #5d330d5e;pointer-events:none}.medal.legend{border-color:#fff7d9;background:radial-gradient(circle at 20% 20%,#fffdcf,#f8bb52 44%,#bb4b21 85%)}.unowned .medal{border-color:#b9beca;background:radial-gradient(circle at 30% 25%,#647182,#293746 70%);box-shadow:inset 0 0 0 3px #556879,0 4px 6px #0007}.portrait{width:94%;height:94%;object-fit:contain;filter:drop-shadow(0 2px 3px #0007)}.question{color:#fff;font-size:36px;font-weight:1000;text-shadow:0 3px #182638}.slotNo{font-size:12px;font-weight:1000;white-space:nowrap;color:#ffedb4}.slotName{font-size:11px;font-weight:1000;line-height:1.3;min-height:2.5em;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere}.slotMeta{font-size:10px;color:#d6ebff;line-height:1.1}.turn{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:8px}.arrow{border:3px solid #fff1b6;border-radius:16px;background:linear-gradient(#f8d977,#dca045);color:#513418;min-width:80px;padding:9px 12px;font-size:15px;font-weight:1000;box-shadow:0 4px 0 #7d4f1d}.arrow:disabled{background:linear-gradient(#7c8b9b,#4e6075);color:#b7c1cc;border-color:#8ca0b2;box-shadow:0 4px 0 #293a4c}.pageNum{font-size:13px;font-weight:1000;color:#ffebaa;text-align:center}.hint{font-size:11px;color:#dceeff;text-align:center;margin:8px 0 0}.detail{margin-top:13px;background:linear-gradient(#fffbec,#f0e2bb);border:4px solid #ecc46d;border-radius:17px;color:#21334e;box-shadow:inset 0 0 0 3px #fff8df,0 7px 14px #07172d80;padding:12px;min-height:175px}.detailHeader{display:flex;gap:12px;align-items:center;margin-bottom:9px}.detailIcon{flex:none;border:4px solid #f7ce70;border-radius:50%;width:85px;height:85px;display:grid;place-items:center;background:radial-gradient(#fff6c5,#e8a83c);box-shadow:inset 0 0 0 2px #ae7528}.detailIcon img{width:72px;height:72px;object-fit:contain}.detailName{font-size:20px;font-weight:1000;margin:0 0 4px;color:#164b83}.pill{background:#21558b;border:2px solid #90c1e0;border-radius:15px;color:white;display:inline-block;padding:3px 8px;font-size:11px;font-weight:900}.detail p{margin:8px 0;line-height:1.7;font-size:13px;font-weight:700}.speech{border-radius:10px;border:2px solid #a7d6ee;background:#fff;padding:9px;color:#284c70}.legendTitle{text-align:center;font-size:22px;color:#ffe7a4;text-shadow:1px 3px #5b3213;margin:19px 0 10px}.seals{display:grid;gap:9px}.seal{border:3px solid #f5cf7a;border-radius:15px;background:linear-gradient(#204e85,#102c5c);padding:11px}.sealHeading{display:flex;align-items:center;gap:11px}.sealSymbol{width:57px;height:57px;border:4px solid #d2ab5e;border-radius:50%;display:grid;place-items:center;background:#293f61;flex:none;overflow:hidden;font-size:27px;font-weight:1000}.sealSymbol img{width:50px;height:50px;object-fit:contain}.sealName{font-size:17px;font-weight:1000;color:#ffe9a1}.need{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0;font-size:12px}.needed{border-radius:8px;background:#0b2448;padding:5px 7px}.sealBtn{border:2px solid #fff1b6;background:linear-gradient(#fee990,#eebd53);color:#543612;border-radius:12px;padding:7px 14px;font-weight:1000}.sealBtn:disabled{background:#65748a;border-color:#9eb0c1;color:#dee8ef}.foot{display:flex;justify-content:center;gap:9px;margin-top:15px}.foot a{padding:9px 12px;border-radius:15px;background:#113565;border:2px solid #a3d6f6;font-weight:900;font-size:12px}.note{font-size:11px;text-align:center;color:#c5dff1;line-height:1.6;margin:14px 0 0}
@media(max-width:370px){.shell{padding:7px 5px 24px}.frame{padding:6px}.inner{padding:10px 6px}.grid{gap:5px}.slot{min-height:139px;padding:5px 2px}.slotName{font-size:10px}.medal{width:68px;height:68px}.nav{font-size:11px;padding:7px}.brand{font-size:14px}.arrow{min-width:72px}}
@media(prefers-reduced-motion:no-preference){.slot.selected{animation:lit .3s ease-out}@keyframes lit{50%{filter:brightness(1.4)}}}
</style></head><body><div class="shell"><header class="upper"><a class="nav" href="gacha.html">◀ ガシャ</a><div class="brand">✧ 妖怪大辞典 ✧</div><a class="nav" href="menu.html">にっき ▶</a></header><main class="frame"><div class="inner"><h1 class="section"><strong>妖怪大辞典</strong></h1><div id="stats" class="progress"></div><div class="tabs" role="tablist" aria-label="大辞典の分類"><button class="tab active" data-filter="all" role="tab" aria-selected="true">ぜんぶ</button><button class="tab" data-filter="プリチー" role="tab">プリチー</button><button class="tab" data-filter="ニョロロン" role="tab">ニョロロン</button><button class="tab" data-filter="other" role="tab">その他の種族</button><button class="tab" data-filter="legend" role="tab">レジェンド</button></div><section class="book" aria-label="妖怪メダル一覧"><div class="bookHeader"><span id="bookTitle">ぜんぶの妖怪</span><span>えいなな 妖怪メダル帳</span></div><div id="grid" class="grid"></div><div class="turn"><button id="prev" class="arrow" type="button">◀ まえ</button><div id="pageNum" class="pageNum" aria-live="polite"></div><button id="next" class="arrow" type="button">つぎ ▶</button></div><p class="hint">メダルをタップすると妖怪の情報が見られるよ！</p></section><section id="detail" class="detail" aria-live="polite"><div class="detailHeader"><div class="detailIcon">📖</div><div><h2 class="detailName">妖怪の紹介</h2><span class="pill">メダルを選んでね</span></div></div><p>登録した妖怪のことを、ここで詳しく読めるよ！</p></section><h2 class="legendTitle">✦ レジェンドの封印 ✦</h2><div id="seals" class="seals"></div><div class="foot"><a href="gacha.html">ガシャにもどる</a><a href="menu.html">にっきにもどる</a></div><p class="note">集めた妖怪はこのブラウザに保存されるよ。履歴やサイトデータを消すと記録が消えることがあります。</p></div></main></div>
<script src="yokai-data.js"></script><script src="yokai-shared.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),PAGE_SIZE=6;let filter='all',page=0,selected=null;const labels={all:'ぜんぶの妖怪','プリチー':'プリチー族','ニョロロン':'ニョロロン族',other:'その他の種族',legend:'レジェンド妖怪'};const all=()=>window.EINANA_YOKAI,owned=()=>window.EinanaDex.get(),find=id=>all().find(x=>x.id===id),filtered=()=>all().filter(y=>filter==='all'||(filter==='legend'?y.legend:filter==='other'?!y.legend&&!['プリチー','ニョロロン'].includes(y.tribe):y.tribe===filter));const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function detail(y,yes,idx,save){selected=y.id;if(!yes){$('detail').innerHTML=`<div class="detailHeader"><div class="detailIcon">？</div><div><h2 class="detailName">No.${String(idx+1).padStart(3,'0')}　？？？？</h2><span class="pill">未登録</span></div></div><p>この妖怪とは、まだともだちになっていないよ。ガシャで出会おう！</p>`;return}$('detail').innerHTML=`<div class="detailHeader"><div class="detailIcon"><img src="${esc(y.img)}" alt="${esc(y.name)}"></div><div><h2 class="detailName">${esc(y.name)}</h2><span class="pill">No.${String(idx+1).padStart(3,'0')}　${esc(y.tribe)} / ${esc(y.rank)}ランク</span></div></div><p>${esc(y.description)}</p><p><b>とくいわざ：</b>${esc(y.skill)}</p><p><b>ひとこと：</b>${esc(y.flavor)}</p><p class="speech">「${esc(y.line)}」</p><p>ともだちになった回数：${Number(save[y.id])||0}回</p>`}function draw(){const save=owned(),list=filtered(),pages=Math.max(1,Math.ceil(list.length/PAGE_SIZE));page=Math.min(Math.max(page,0),pages-1);$('stats').innerHTML=`<b>${all().filter(y=>save[y.id]).length} / ${all().length} 体</b>　ともだち登録中！`;$('bookTitle').textContent=labels[filter];$('pageNum').textContent=`${page+1} / ${pages} ページ`;$('prev').disabled=page===0;$('next').disabled=page===pages-1;const grid=$('grid');grid.replaceChildren();list.slice(page*PAGE_SIZE,(page+1)*PAGE_SIZE).forEach(y=>{let yes=!!save[y.id],b=document.createElement('button'),idx=all().indexOf(y);b.type='button';b.className='slot'+(yes?'':' unowned');b.setAttribute('aria-label',`No.${idx+1} ${yes?y.name:'未登録'}`);b.innerHTML=`<span class="medal ${yes&&y.legend?'legend':''}">${yes?`<img class="portrait" src="${esc(y.img)}" alt="">`:'<span class="question">？</span>'}</span><span class="slotNo">No.${String(idx+1).padStart(3,'0')}</span><span class="slotName">${yes?esc(y.name):'？？？？'}</span><span class="slotMeta">${yes?esc(y.tribe)+' / '+esc(y.rank):'未登録'}</span>`;b.onclick=()=>{detail(y,yes,idx,save);document.querySelectorAll('.slot').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};grid.append(b)});if(list.length===0)grid.innerHTML='<p>妖怪がいないよ！</p>';drawSeals(save)}function drawSeals(save){const el=$('seals');el.replaceChildren();Object.entries(window.EINANA_SEALS).forEach(([id,needs])=>{const y=find(id),done=!!save[id],ready=needs.every(n=>save[n]),node=document.createElement('section');node.className='seal';node.innerHTML=`<div class="sealHeading"><div class="sealSymbol">${done?`<img src="${esc(y.img)}" alt="">`:'？'}</div><div><div class="sealName">${esc(y.name)}</div><div>${done?'✨ 封印が解けた！':ready?'✨ 封印を解けるよ！':'🔒 封印中'}</div></div></div><div class="need">${needs.map(n=>{const z=find(n);return `<span class="needed">${save[n]?'✅':'🔒'} ${esc(z.name)}</span>`}).join('')}</div>`;const b=document.createElement('button');b.className='sealBtn';b.disabled=done||!ready;b.textContent=done?'ともだちになった！':ready?'封印を解く！':'封印中';b.onclick=()=>{EinanaDex.add(id);draw();alert(`${y.name}の封印が解けた！\n「${y.line}」`)};node.append(b);el.append(node)})}document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;page=0;document.querySelectorAll('.tab').forEach(x=>{const a=x===b;x.classList.toggle('active',a);x.setAttribute('aria-selected',a?'true':'false')});draw()}));$('prev').onclick=()=>{page--;draw()};$('next').onclick=()=>{page++;draw()};window.addEventListener('pageshow',draw);window.addEventListener('einana-dex-updated',draw);draw()})();
</script></body></html>
