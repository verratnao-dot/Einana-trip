<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>妖怪大辞典 | えいなな旅行</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;color:#fff;background:radial-gradient(circle at top,#2767a3,#101c43 65%,#0b1731)}a{color:inherit}.top{max-width:680px;margin:auto;padding:14px;display:flex;gap:10px;justify-content:space-between;align-items:center}.top a{background:#ffdb61;color:#17244a;text-decoration:none;padding:9px 13px;border-radius:20px;font-weight:900;border:3px solid #fff}.panel{max-width:680px;margin:8px auto 30px;padding:15px;background:#173967;border:5px solid #8bdcff;border-radius:22px;box-shadow:inset 0 0 0 3px #09244a,0 10px 25px #0006}.heading{color:#ffe680;text-shadow:2px 3px #763e13;text-align:center;font-size:26px;margin:6px 0 12px}.stats{text-align:center;background:#092549;border-radius:16px;padding:10px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:15px}.slot{border:3px solid #a4c6ff;background:linear-gradient(#336da0,#102b56);border-radius:15px;min-height:142px;color:white;padding:7px 3px;display:flex;align-items:center;flex-direction:column;justify-content:center;gap:4px;font-weight:800}.slot:active{transform:scale(.97)}.slot.lock{filter:saturate(.55);border-color:#59718f}.medal{height:74px;width:74px;border:6px ridge #e4c67b;border-radius:50%;display:grid;place-items:center;font-size:38px;background:radial-gradient(circle,#f7f2bf,#f7bd50 60%,#93601b);box-shadow:0 3px 10px #0009}.lock .medal{background:#263b59;border-color:#54617b;filter:grayscale(1)}.slot small{font-size:10px;color:#ffedb0}.name{font-size:12px}.detail{margin-top:14px;padding:13px;background:#0b244a;border:2px solid #80caff;border-radius:15px;text-align:center;min-height:65px}.seal{margin:12px 0;padding:12px;background:#0d2b52;border:3px solid #d9af58;border-radius:18px}.seal h3{margin:0 0 7px;color:#ffe38c}.seal .needs{font-size:13px;line-height:1.9}.unlock{background:#ffdf69;color:#432c07;border:0;border-radius:20px;font-weight:900;padding:10px 20px;margin-top:8px}.unlock:disabled{background:#55627c;color:#ddd}.note{font-size:12px;opacity:.8;text-align:center}</style></head><body><header class="top"><a href="gacha.html">← ガチャ</a><strong>📖 妖怪大辞典</strong><a href="menu.html">にっき →</a></header><main class="panel"><h1 class="heading">妖怪大辞典</h1><div id="stats" class="stats"></div><div id="grid" class="grid"></div><div id="detail" class="detail">メダルをタップして妖怪を見よう！</div><h2 class="heading">🔒 レジェンドの封印</h2><div id="seals"></div><p class="note">この端末のブラウザに保存されます。ブラウザデータを消すと記録も消える場合があります。</p></main><script src="yokai-data.js"></script><script src="yokai-shared.js"></script><script>const grid=document.querySelector('#grid'),stats=document.querySelector('#stats'),seals=document.querySelector('#seals'),detail=document.querySelector('#detail');function render(){const owned=EinanaDex.get();stats.textContent=`ともだち ${Object.keys(owned).length} / ${EINANA_YOKAI.length} 体`;grid.innerHTML='';EINANA_YOKAI.forEach((y,idx)=>{const yes=!!owned[y.id],b=document.createElement('button');b.className='slot'+(yes?'':' lock');b.innerHTML=`<span class="medal">${yes?y.emoji:'？'}</span><span class="name">No.${String(idx+1).padStart(3,'0')} ${yes?y.name:'？？？？'}</span><small>${yes?y.tribe+' / '+y.rank:'未登録'}</small>`;b.onclick=()=>{detail.textContent=yes?`${y.name}　${y.rank}ランク　「${y.line}」　ともだち ${owned[y.id]}回`:'まだ ともだちになっていない妖怪だよ！'};grid.append(b)});seals.innerHTML='';Object.entries(EINANA_SEALS).forEach(([id,needs])=>{const y=EINANA_YOKAI.find(x=>x.id===id),ready=needs.every(n=>owned[n]),done=!!owned[id],div=document.createElement('section');div.className='seal';div.innerHTML=`<h3>🔐 ${y.name} ${done?'✨ 封印解除！':''}</h3><div class="needs">${needs.map(n=>{let z=EINANA_YOKAI.find(x=>x.id===n);return (owned[n]?'✅ ':'🔒 ')+z.name}).join('　')}</div>`;const btn=document.createElement('button');btn.className='unlock';btn.disabled=!ready||done;btn.textContent=done?'ともだち！':ready?'封印を解く！':'封印中';btn.onclick=()=>{EinanaDex.add(id);alert(`${y.name}の封印が解けた！
「${y.line}」`);render()};div.append(btn);seals.append(div)})}render();</script></body></html>
