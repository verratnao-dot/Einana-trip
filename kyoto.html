<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>🌸 京都にっき</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#103f78;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#182d58}.screen{width:min(100%,706px);margin:auto;position:relative;background:url('kyoto-screen.jpg') center top/100% 100% no-repeat;aspect-ratio:706/1536}.hot{position:absolute;border:0;background:transparent;cursor:pointer;padding:0;touch-action:manipulation}.hot:active{background:#fff3;border-radius:12px}.statsValue{position:absolute;z-index:2;color:#ffdb38;background:#071f39;font-weight:1000;text-align:center;font-size:clamp(11px,3.2vw,23px);line-height:1.12;padding:1px 2px}.statsValue.exp{left:5%;top:54.5%;width:26%}.statsValue.coin{left:36%;top:54.5%;width:30%}.statsValue.spent{left:69%;top:54.5%;width:27%}.questOverlay{position:fixed;inset:0;z-index:30;background:#071b40b8;display:none;align-items:center;justify-content:center;padding:12px}.questOverlay.show{display:flex}.panel{width:min(560px,100%);max-height:88dvh;overflow:auto;background:linear-gradient(#e8f4ff,#c4d7ff);border:6px solid #fff;border-radius:23px;box-shadow:0 0 0 5px #5743be,0 12px 35px #0008;padding:16px}.panel h2{margin:2px 0 6px;font-size:22px;color:#20396e}.time{font-size:13px;color:#31599c;font-weight:900}.desc{background:#fff;border:2px solid #a5b4fc;border-radius:14px;padding:12px;line-height:1.6}.mission,.memory,.money{margin:12px 0;border:3px solid #9b83ee;border-radius:16px;padding:12px;background:#fff}.mission b,.memory b,.money b{display:block;color:#4338ca;margin-bottom:8px}.mission label{display:flex;gap:8px;align-items:center;font-weight:800}.mission input{width:24px;height:24px}.memory img{display:block;width:100%;max-height:230px;object-fit:contain;border-radius:10px;margin:8px 0}.pink,.yellow,.back{border:3px solid #fff;border-radius:20px;padding:11px 16px;font-weight:1000;font-size:16px;box-shadow:0 4px 0 #324d8c}.pink{background:#ff4f9e;color:#fff}.yellow{background:#ffcf32;color:#28355c}.back{background:#6450df;color:#fff}.actions{display:flex;gap:9px;justify-content:space-between;margin-top:15px}.moneyrow{display:flex;gap:7px}.moneyrow input{width:60%;min-width:0;border:2px solid #a5b4fc;border-radius:12px;padding:10px;font-size:16px}.moneyrow button{flex:1}.toast{position:fixed;z-index:70;left:50%;bottom:10%;transform:translateX(-50%);background:#ffe866;color:#382400;border:3px solid white;border-radius:15px;padding:12px 18px;font-weight:900;display:none;max-width:90%;text-align:center}.toast.show{display:block}.mapPane{width:min(600px,100%)}.mapView{position:relative;height:min(65dvh,600px);overflow:hidden;touch-action:none;border-radius:15px;border:4px solid #fff;background:#80c5df}.mapArt{position:absolute;width:100%;height:auto;top:0;left:0;transform-origin:top left;pointer-events:none}.mapTools{display:flex;align-items:center;gap:10px;justify-content:center;margin:10px 0}.mapTools button{font-size:22px;border:2px solid #fff;background:#f7dd64;border-radius:12px;padding:7px 16px}.mapTools input{flex:1;min-width:0}.menuLinks{display:grid;grid-template-columns:1fr 1fr;gap:10px}.menuLinks a{padding:15px;background:#fff7ce;border:3px solid #fff;border-radius:12px;text-align:center;text-decoration:none;font-weight:900;color:#193763}
</style></head><body><div class="screen" id="screen">
<div class="statsValue exp" id="exp">0</div><div class="statsValue coin" id="coin">0P</div><div class="statsValue spent" id="spent">0円</div>

<div class="questOverlay" id="questOverlay"><div class="panel"><h2 id="qTitle"></h2><div class="time" id="qTime"></div><p class="desc" id="qDesc"></p><div class="mission"><b>🎯 ミッション</b><label><input id="qDone" type="checkbox">このクエストを攻略する！</label></div><div class="memory"><b>📸 MEMORY</b><div id="photoStatus">2人の思い出写真をGET</div><img id="photo" hidden><button class="pink" id="photoButton">＋ 写真を追加</button><input id="file" type="file" accept="image/*" hidden></div><div class="money"><b>💴 つかったおかね</b><div class="moneyrow"><input id="amount" inputmode="numeric" placeholder="例：3500"><button class="yellow" id="record">記録</button></div></div><div class="actions"><button class="back" data-close>Ⓑ もどる</button><button class="pink" id="next">次のクエスト ▶</button></div></div></div>
<div class="questOverlay" id="mapOverlay"><div class="panel mapPane"><h2>🗺️ 京都のMAP</h2><div class="mapView" id="mapView"><img class="mapArt" id="mapArt" src="kyoto-screen.jpg" alt="京都ゲームマップ"></div><div class="mapTools"><button id="minus">−</button><input id="zoom" type="range" min="100" max="250" value="100" aria-label="拡大縮小"><button id="plus">＋</button></div><div class="actions"><button class="back" data-close>Ⓑ もどる</button><button class="yellow" id="mapQuest">Ⓐ クエストへ</button></div><small>地図を指で動かせるよ。右のバーと同じように拡大縮小できるよ。</small></div></div>
<div class="questOverlay" id="menuOverlay"><div class="panel"><h2>🎮 メインメニュー</h2><div class="menuLinks"><a href="menu.html">📖 にっき</a><a href="inventory.html">🎒 もちもの</a><a href="gacha.html">🎰 ガチャ</a><a href="money.html">💰 おかね</a><a href="map-kyoto.html">🗺️ この日のMAP</a><a href="index.html">🏠 タイトル</a></div><div class="actions"><button class="back" data-close>Ⓑ もどる</button></div></div></div><div class="toast" id="toast"></div>
<script>(function(){'use strict';
var Q=[['⛴️ 東予港 → 大阪南港','10/15 22:00 → 10/16 6:00','フェリー船内泊で旅スタート！'],['⛩️ 伏見稲荷大社','8:00〜8:45','千本鳥居から京都クエスト開始！'],['🎋 嵐山・渡月橋','9:45〜10:45','朝の嵐山と渡月橋を散策。'],['✨ 金閣寺','11:30〜12:15','金色に輝く金閣寺を攻略。'],['💍 Owl Labo','13:00〜14:15','2人のオリジナルリング作り♡'],['🌸 清水寺','14:30〜15:15','清水の舞台と京都らしい景色を満喫。'],['🍡 産寧坂・二寧坂','15:15〜16:15','食べ歩き＆京都の街並みを散策。'],['🗼 京都タワー','16:45〜17:30','京都の街を一望！'],['🏨 和泉屋旅館','17:45頃','チェックインして京都ステージCOMPLETE！']];
var E='einana-total-exp-v1',M='einana-game-money-v1',S='einana-spent-total-v1',P='einana-memory-v1:🌸 京都にっき:',DB='einana-memory-images-v1',db=null,sel=0;
function $(x){return document.getElementById(x)}function n(k){return Math.max(0,Number(localStorage.getItem(k)||0)||0)}function fmt(x){return x.toLocaleString('ja-JP')}function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(function(){$('toast').classList.remove('show')},2000)}
function refresh(){$('exp').textContent=fmt(n(E));$('coin').textContent=fmt(n(M))+'P';$('spent').textContent=fmt(n(S))+'円'}
function close() {document.querySelectorAll('.questOverlay').forEach(function(x){x.classList.remove('show')})}
function showQ(i){sel=Math.max(0,Math.min(Q.length-1,i));close();$('qTitle').textContent=Q[sel][0];$('qTime').textContent=Q[sel][1];$('qDesc').textContent=Q[sel][2];$('qDone').checked=localStorage.getItem('einana-quest-cleared:kyoto:'+sel)==='1';$('photo').hidden=true;$('photoStatus').textContent='2人の思い出写真をGET';$('questOverlay').classList.add('show');if(db){var req=db.transaction('photos').objectStore('photos').get(P+sel);req.onsuccess=function(){if(req.result){$('photo').src=req.result;$('photo').hidden=false;$('photoStatus').textContent='おもいで記録済み ✓'}}}}
function openMap(){close();$('mapOverlay').classList.add('show');setZoom(100)}
function setZoom(z){z=Math.max(100,Math.min(250,z));$('zoom').value=z;$('mapArt').style.transform='scale('+(z/100)+')'}
function go(a){if(a==='back'){if(document.querySelector('.questOverlay.show'))close();else location.href='menu.html'}else if(a==='map')openMap();else if(a==='menu'){close();$('menuOverlay').classList.add('show')}else if(a==='detail')showQ(sel)}
document.querySelectorAll('.hot').forEach(function(b){b.onclick=function(){if(b.dataset.href){location.href=b.dataset.href}else if(b.dataset.q!==undefined){showQ(Number(b.dataset.q))}else go(b.dataset.action)}});
document.querySelectorAll('[data-close]').forEach(function(b){b.onclick=close});document.querySelectorAll('.questOverlay').forEach(function(o){o.onclick=function(e){if(e.target===o)close()}});
$('qDone').onchange=function(){localStorage.setItem('einana-quest-cleared:kyoto:'+sel,this.checked?'1':'0');toast(this.checked?'🎉 クエストクリア！':'ミッションを未クリアにしたよ')};$('next').onclick=function(){showQ((sel+1)%Q.length)};
$('record').onclick=function(){var v=Number(($('amount').value||'').replace(/[^0-9]/g,''));if(!Number.isSafeInteger(v)||v<=0){toast('金額を入力してね');return}localStorage.setItem(M,String(n(M)+v));localStorage.setItem(S,String(n(S)+v));var log=[];try{log=JSON.parse(localStorage.getItem('einana-spent-log-v1')||'[]');if(!Array.isArray(log))log=[]}catch(e){}log.push({date:new Date().toISOString(),amount:v,place:Q[sel][0]});localStorage.setItem('einana-spent-log-v1',JSON.stringify(log));$('amount').value='';refresh();toast('💰 '+fmt(v)+'円を記録！ ＋'+fmt(v)+'P')};
$('photoButton').onclick=function(){$('file').click()};$('file').onchange=function(){var file=this.files&&this.files[0];if(!file)return;if(!db){toast('このブラウザでは写真を保存できないよ');return}var reader=new FileReader();reader.onload=function(){var im=new Image();im.onload=function(){var w=im.width,h=im.height,s=Math.min(1,1200/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);var data=c.toDataURL('image/jpeg',.76),key=P+sel,tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(data,key);tx.oncomplete=function(){$('photo').src=data;$('photo').hidden=false;$('photoStatus').textContent='おもいで記録済み ✓';if(!localStorage.getItem(key+':xp')){localStorage.setItem(key+':xp','1');localStorage.setItem(E,String(n(E)+100));refresh();toast('⭐ おもいでGET！ EXP +100')}else toast('📸 写真を更新したよ')}};im.src=reader.result};reader.readAsDataURL(file)};
$('plus').onclick=function(){setZoom(Number($('zoom').value)+20)};$('minus').onclick=function(){setZoom(Number($('zoom').value)-20)};$('zoom').oninput=function(){setZoom(Number(this.value))};$('mapQuest').onclick=function(){showQ(sel)};
var view=$('mapView'),sx=0,sy=0,dx=0,dy=0,drag=false;view.addEventListener('pointerdown',function(e){drag=true;sx=e.clientX-dx;sy=e.clientY-dy;view.setPointerCapture(e.pointerId)});view.addEventListener('pointermove',function(e){if(!drag)return;dx=e.clientX-sx;dy=e.clientY-sy;var z=Number($('zoom').value)/100;var rect=view.getBoundingClientRect();dx=Math.min(0,Math.max(-rect.width*(z-1),dx));dy=Math.min(0,Math.max(-rect.width*1536/706*z+rect.height,dy));$('mapArt').style.transform='translate('+dx+'px,'+dy+'px) scale('+z+')'});view.addEventListener('pointerup',function(){drag=false});
try{var request=indexedDB.open(DB,1);request.onupgradeneeded=function(e){if(!e.target.result.objectStoreNames.contains('photos'))e.target.result.createObjectStore('photos')};request.onsuccess=function(e){db=e.target.result}}catch(e){}
localStorage.setItem('einana-last-diary','kyoto');refresh();})();</script></body></html>
