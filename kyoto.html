;border:2px solid #8477df;border-radius:10px;margin:7px 0;padding:6px;font-size:clamp(10px,2.6vw,14px)}.task b{display:block;background:#39349a;color:#ffe43d;border-radius:10px;padding:2px 8px;width:max-content;max-width:100%;margin-bottom:5px}.task label{display:flex;align-items:center;gap:4px}.task input[type=checkbox]{width:20px;height:20px;flex:none}.task button{border:2px solid white;background:#f74b99;color:white;border-radius:9px;padding:6px;font-weight:900}.task input[type=number]{width:60%;min-width:0;padding:7px;border:1px solid #aaa;border-radius:8px}.task img{width:100%;max-height:150px;object-fit:cover;border-radius:8px;margin-top:5px}.reward{text-align:center;font-weight:1000;color:#243b83;background:#fff9b3;border-radius:10px;padding:7px}.bottom{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:10px 6px;background:#064273}.bottom a{background:#fff9e4;border:3px solid #fff;border-radius:15px;padding:11px 1px;text-decoration:none;color:#173260;font-size:clamp(10px,2.8vw,17px);text-align:center;font-weight:1000}.ab{display:flex;justify-content:space-around;padding:4px 0 15px;background:#064273}.ab button{border:4px solid #fff;border-radius:30px;background:#7251dc;color:white;padding:9px 20px;font-weight:1000;font-size:17px}.ab button:last-child{background:#f53b95}.toast{position:fixed;bottom:15%;left:50%;transform:translateX(-50%);background:#ffe762;border:3px solid white;padding:12px;border-radius:15px;font-weight:900;z-index:20;display:none;max-width:90%;text-align:center}.toast.show{display:block}.overlay{position:fixed;inset:0;background:#001b47a8;z-index:30;display:none;align-items:center;justify-content:center}.overlay.show{display:flex}.overlay>div{background:#b8e4ff;border:5px solid white;border-radius:22px;padding:18px;width:min(90%,400px)}.overlay a{display:block;padding:12px;background:#fff;margin:7px;border-radius:12px;color:#123c74;text-decoration:none;font-weight:900}
</style></head><body><main class="game"><section class="map" id="map"><img class="mapImage" id="mapImage" src="kyoto-screen.jpg" alt="京都のゲーム風マップ"><div class="mapHead">京都 <small>10/16（金）</small></div><div class="zoom"><button id="plus" aria-label="拡大">＋</button><input id="zoom" type="range" min="100" max="260" value="100" aria-label="マップの拡大縮小"><button id="minus" aria-label="縮小">－</button></div><button class="menuBubble" id="menuBtn">☰ メニュー</button><div class="mapTip">京都の観光クエストを攻略しよう！</div></section><section class="status"><div class="hero"><span class="face">👦🏻</span><div>えいと <b id="lv1">Lv 1</b><div class="bar"><i id="bar1"></i></div><small id="until1"></small></div></div><div class="hero"><span class="face">👩🏻</span><div>ななこ <b id="lv2">Lv 1</b><div class="bar"><i id="bar2"></i></div><small id="until2"></small></div></div></section><div class="numbers"><div class="num">⭐ けいけんち<strong id="exp">0</strong></div><div class="num">💰 たびマネー<strong id="coin">0P</strong></div><div class="num">💴 つかったおかね<strong id="spent">0円</strong></div></div><section class="quests"><h2>📜 クエストをえらぶ</h2><div class="two"><div class="list" id="list"></div><article class="detail" id="detail"><h3 id="qtitle"></h3><div class="picture" id="qpicture"></div><div class="time" id="qtime"></div><p id="qdesc"></p><div class="task"><b>ミッション</b><label><input type="checkbox" id="done">このクエストを攻略する</label></div><div class="task"><b>おもいで</b><span id="photoStatus">📸 2人の思い出写真をGET</span><img id="photo" hidden><button id="addPhoto">＋ 写真を追加</button><input type="file" accept="image/*" id="file" hidden></div><div class="task"><b>つかったおかね</b><input type="number" id="amount" placeholder="金額" inputmode="numeric"><button id="record">記録</button></div><div class="reward">⭐ 写真で EXP +100</div></article></div></section><nav class="bottom"><a href="menu.html">📖 にっき</a><a href="inventory.html">🎒 もちもの</a><a href="gacha.html">🎰 ガチャ</a><a href="money.html">💰 おかね</a></nav><div class="ab"><button id="back">Ⓑ もどる</button><button id="confirm">Ⓐ けってい</button></div></main><div class="overlay" id="menu"><div><h2>🎮 メニュー</h2><a href="menu.html">📖 にっき</a><a href="map-kyoto.html">🗺️ MAP</a><a href="inventory.html">🎒 もちもの</a><a href="gacha.html">🎰 ガチャ</a><button id="closeMenu">B もどる</button></div></div><div class="toast" id="toast"></div><script>
(function(){'use strict';
const Q=[['⛴️','東予港 → 大阪南港','10/15 22:00 → 10/16 6:00','フェリー船内泊で旅スタート！',0],['⛩️','伏見稲荷大社','8:00〜8:45','千本鳥居から京都クエスト開始！',1],['🎋','嵐山・渡月橋','9:45〜10:45','朝の嵐山と渡月橋を散策。',2],['✨','金閣寺','11:30〜12:15','金色に輝く金閣寺を攻略。',3],['🍱','おひるごはん・移動','12:15〜13:30','京都らしいごはんを楽しんで、清水寺へ向かおう！','lunch'],['🌸','清水寺','13:30〜14:30','清水の舞台と京都らしい景色を満喫。',5],['🍡','産寧坂・二寧坂','14:30〜16:00','食べ歩き＆京都の街並みをゆっくり散策。',6],['🗼','京都タワー','16:45〜17:30','京都の街を一望！',7],['🏨','和泉屋旅館','17:45頃','チェックインして京都ステージCOMPLETE！',8]];
const E='einana-total-exp-v1',M='einana-game-money-v1',S='einana-spent-total-v1',P='einana-memory-v1:🌸 京都にっき:',DB='einana-memory-images-v1';let sel=0,db=null;const $=id=>document.getElementById(id),num=k=>Math.max(0,Number(localStorage.getItem(k)||0)||0),fmt=x=>x.toLocaleString('ja-JP');function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2000)}
function refresh(){let e=num(E),lv=Math.floor(e/500)+1,remaining=500-e%500;$('exp').textContent=fmt(e);$('coin').textContent=fmt(num(M))+'P';$('spent').textContent=fmt(num(S))+'円';['1','2'].forEach(i=>{$('lv'+i).textContent='Lv '+lv;$('until'+i).textContent='つぎまで '+remaining+' EXP';$('bar'+i).style.width=(e%500/500*100)+'%'})}
function select(i){sel=Math.max(0,Math.min(Q.length-1,i));let q=Q[sel];document.querySelectorAll('.qbtn').forEach((b,j)=>b.classList.toggle('active',j===sel));$('qtitle').textContent=(sel+1)+' '+q[1];$('qpicture').textContent=q[0];$('qtime').textContent=q[2];$('qdesc').textContent=q[3];$('done').checked=localStorage.getItem('einana-quest-cleared:kyoto:'+Q[sel][4])==='1';$('photo').hidden=true;$('photoStatus').textContent='📸 2人の思い出写真をGET';if(db){let r=db.transaction('photos').objectStore('photos').get(P+Q[sel][4]);r.onsuccess=()=>{if(r.result&&sel===i){$('photo').src=r.result;$('photo').hidden=false;$('photoStatus').textContent='おもいで記録済み ✓'}}}}
$('list').innerHTML=Q.map((q,i)=>'<button class="qbtn" data-i="'+i+'"><span class="qno">'+(i+1)+'</span><span class="qico">'+q[0]+'</span><span class="qtext">'+q[1]+'<small>'+q[2]+'</small></span></button>').join('');document.querySelectorAll('.qbtn').forEach(b=>b.onclick=()=>select(Number(b.dataset.i)));
$('done').onchange=function(){localStorage.setItem('einana-quest-cleared:kyoto:'+Q[sel][4],this.checked?'1':'0');toast(this.checked?'🎉 クエストクリア！':'未クリアに戻したよ')};$('record').onclick=function(){let v=Number($('amount').value);if(!Number.isSafeInteger(v)||v<=0){toast('金額を入力してね');return}localStorage.setItem(M,String(num(M)+v));localStorage.setItem(S,String(num(S)+v));let log=[];try{log=JSON.parse(localStorage.getItem('einana-spent-log-v1')||'[]');if(!Array.isArray(log))log=[]}catch(e){}log.push({date:new Date().toISOString(),amount:v,place:Q[sel][1]});localStorage.setItem('einana-spent-log-v1',JSON.stringify(log));$('amount').value='';refresh();toast('💰 '+fmt(v)+'円記録！ ＋'+fmt(v)+'P')};
$('addPhoto').onclick=()=>$('file').click();$('file').onchange=function(){let f=this.files&&this.files[0],i=sel;if(!f)return;if(!db){toast('写真を保存できないよ');return}let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let s=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);let data=c.toDataURL('image/jpeg',.76),key=P+Q[i][4],tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(data,key);tx.oncomplete=()=>{if(sel===i){$('photo').src=data;$('photo').hidden=false;$('photoStatus').textContent='おもいで記録済み ✓'}if(!localStorage.getItem(key+':xp')){localStorage.setItem(key+':xp','1');localStorage.setItem(E,String(num(E)+100));refresh();toast('⭐ EXP +100！')}else toast('📸 写真を更新したよ！')}};im.src=reader.result};reader.readAsDataURL(f)};
$('confirm').onclick=()=>select((sel+1)%Q.length);$('back').onclick=()=>location.href='menu.html';$('menuBtn').onclick=()=>$('menu').classList.add('show');$('closeMenu').onclick=()=>$('menu').classList.remove('show');$('menu').onclick=e=>{if(e.target===$('menu'))$('menu').classList.remove('show')};
// The map is its own pan/zoom surface. Only the illustration transforms; quest UI stays fixed.
let scale=1,dx=0,dy=0,startX=0,startY=0,drag=false;const map=$('map'),art=$('mapImage');function paint(){let w=map.clientWidth,h=map.clientHeight;dx=Math.max(w*(1-scale),Math.min(0,dx));dy=Math.max(h*(1-scale),Math.min(0,dy));art.style.transform='translate('+dx+'px,'+dy+'px) scale('+scale+')'}function zoom(v){let prev=scale;scale=Math.max(1,Math.min(2.6,v));dx=dx*scale/prev-(map.clientWidth/2)*(scale/prev-1);dy=dy*scale/prev-(map.clientHeight/2)*(scale/prev-1);$('zoom').value=Math.round(scale*100);paint()}$('zoom').oninput=e=>zoom(Number(e.target.value)/100);$('plus').onclick=()=>zoom(scale+.2);$('minus').onclick=()=>zoom(scale-.2);map.onpointerdown=e=>{if(e.target.closest('.zoom,.menuBubble'))return;drag=true;startX=e.clientX-dx;startY=e.clientY-dy;map.setPointerCapture(e.pointerId)};map.onpointermove=e=>{if(!drag)return;dx=e.clientX-startX;dy=e.clientY-startY;paint()};map.onpointerup=()=>drag=false;map.onpointercancel=()=>drag=false;
try{let r=indexedDB.open(DB,1);r.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('photos'))e.target.result.createObjectStore('photos')};r.onsuccess=e=>{db=e.target.result;select(sel)}}catch(e){}localStorage.setItem('einana-last-diary','kyoto');select(0);refresh();
})();</script></body></html>
