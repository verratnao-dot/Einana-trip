nd:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:200}.overlay.show{display:flex}.result{width:min(450px,100%);background:linear-gradient(#adf37d,#4bce80);border:6px solid #fff;border-radius:27px;padding:18px;color:#285235;box-shadow:0 10px 0 #21866a}.result h2{text-align:center;font-size:25px;margin:0 0 15px;color:#fff;text-shadow:2px 2px #28845c}.resultline{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:2px dashed #fff;font-weight:1000}.resultline b{font-size:23px;color:#fff4a0;text-shadow:2px 2px #5d8833}.result button{display:block;margin:20px auto 0;padding:10px 35px;border:4px solid #fff;border-radius:30px;background:#ffce54;font-weight:1000;color:#5b4a28}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#ffdc64;border:3px solid white;padding:12px;border-radius:15px;font-weight:1000;display:none;z-index:250;white-space:nowrap;box-shadow:0 5px 15px #0005}.toast.show{display:block}@media(max-width:380px){.top h1{font-size:30px}.qname{font-size:14px}.panel{margin-left:8px;margin-right:8px}.stat b{font-size:20px}}
</style></head><body><div class="app"><header class="top"><span class="eyebrow">えいなな旅行 ✦ にっき１</span><h1>🌸 京都のぼうけん</h1><p>10/15〜10/16　京都ステージ</p></header><nav class="nav"><a href="menu.html">◀ にっき</a><a href="map-kyoto.html">🗺️ MAP</a><a href="index.html">🏠 タイトル</a></nav><section class="status"><div class="statushead"><span class="avatars">👦🏻👧🏻</span><div><strong>えいと ＆ ななこ</strong><small>京都のたびを ぼうけん中！</small></div></div><div class="meter"><div id="xpFill"></div></div><div class="level"><span id="level">レベル 1</span><span id="levelProgress">つぎまで 500 EXP</span></div><div class="stats"><div class="stat"><small>⭐ けいけんち</small><b id="exp">0</b></div><div class="stat"><small>💰 たびマネー</small><b id="coin">0P</b></div><div class="stat wide"><small>💴 つかったおかね</small><b id="spent">0円</b></div></div></section><section class="panel"><div class="paneltitle"><span>📜</span> クエストをえらぶ</div><div id="quests"></div></section></div>
<nav class="bottom"><a href="menu.html">📖 にっき</a><a href="inventory.html">🎒 もちもの</a><a href="gacha.html">🎰 ガチャ</a><a href="money.html">💰 おかね</a></nav>
<button class="menuBtn" id="menuBtn" aria-label="ゲームメニュー">☰</button><div class="shade" id="shade"><div class="menuPanel"><h2>🎮 ゲームメニュー</h2><div class="menuGrid"><a href="inventory.html">🎒<br>もちもの</a><a href="gacha.html">🎰<br>ガチャ</a><a href="menu.html">📖<br>にっき選択</a><a href="map-kyoto.html">🗺️<br>この日のMAP</a></div><button class="close" id="close">B もどる</button></div></div>
<div class="overlay" id="overlay"><div class="result"><h2>✨ クエストけっか ✨</h2><div class="resultline"><span>⭐ けいけんち</span><b id="resultXp">＋0</b></div><div class="resultline"><span>💴 つかったおかね</span><b id="resultSpent">0円</b></div><div class="resultline"><span>💰 たびマネー</span><b id="resultCoin">＋0P</b></div><button id="resultOk">A けってい</button></div></div><div class="toast" id="toast"></div>
<script>
(function(){'use strict';
var QUESTS=[['⛴️','東予港 → 大阪南港','10/15 22:00 → 10/16 6:00','フェリー船内泊で旅スタート！'],['⛩️','伏見稲荷大社','8:00〜8:45','千本鳥居から京都クエスト開始！'],['🎋','嵐山・渡月橋','9:45〜10:45','朝の嵐山と渡月橋を散策。'],['✨','金閣寺','11:30〜12:15','金色に輝く金閣寺を攻略。'],['💍','Owl Labo','13:00〜14:15','2人のオリジナルリング作り♡'],['🌸','清水寺','14:30〜15:15','清水の舞台と京都らしい景色を満喫。'],['🍡','産寧坂・二寧坂','15:15〜16:15','食べ歩き＆京都の街並みを散策。'],['🗼','京都タワー','16:45〜17:30','京都の街を一望！'],['🏨','和泉屋旅館','17:45頃','チェックインして京都ステージCOMPLETE！']];
var EXP='einana-total-exp-v1',COIN='einana-game-money-v1',SPENT='einana-spent-total-v1',PREFIX='einana-memory-v1:🌸 京都にっき:',DB='einana-memory-images-v1',db=null;
function el(id){return document.getElementById(id)}function num(key){return Math.max(0,Number(localStorage.getItem(key)||0)||0)}function yen(n){return Number(n).toLocaleString('ja-JP')}function set(key,n){localStorage.setItem(key,String(n))}
// Old Kyoto diary used different keys. Import only if the new shared key is absent.
if(localStorage.getItem(COIN)===null&&localStorage.getItem('einana-coin-v1')!==null)set(COIN,num('einana-coin-v1'));
if(localStorage.getItem(SPENT)===null&&localStorage.getItem('einana-spend-v1')!==null)set(SPENT,num('einana-spend-v1'));
function refresh(){var x=num(EXP),lv=Math.floor(x/500)+1,within=x%500;el('exp').textContent=yen(x);el('coin').textContent=yen(num(COIN))+'P';el('spent').textContent=yen(num(SPENT))+'円';el('level').textContent='レベル '+lv;el('levelProgress').textContent='つぎまで '+(500-within)+' EXP';el('xpFill').style.width=(within/500*100)+'%'}
function result(x,m){el('resultXp').textContent='＋'+yen(x);el('resultSpent').textContent=yen(m)+'円';el('resultCoin').textContent='＋'+yen(m)+'P';el('overlay').classList.add('show')}
function toast(t){el('toast').textContent=t;el('toast').classList.add('show');setTimeout(function(){el('toast').classList.remove('show')},2100)}
var root=el('quests');QUESTS.forEach(function(q,i){var d=document.createElement('details');d.className='quest';d.innerHTML='<summary><span class="qicon">'+q[0]+'</span><span class="qinfo"><span class="qname">'+q[1]+'</span><div class="qtime">'+q[2]+'</div></span><span class="arrow">▶</span></summary><div class="qbody"><p class="desc">'+q[3]+'</p><div class="mission"><strong>🎯 MISSION</strong><p>このクエストを攻略する！</p></div><div class="memory"><strong>📸 MEMORY</strong><p class="memstatus">2人の思い出写真をGET</p><button type="button" class="add">＋ 写真を追加</button><input type="file" accept="image/*" hidden></div><div class="moneybox"><strong>💴 つかったおかね</strong><div class="moneyrow"><input inputmode="numeric" type="text" placeholder="例：3500"><button type="button">記録</button></div></div></div>';root.appendChild(d);
var mem=d.querySelector('.memory'),file=d.querySelector('input[type=file]'),key=PREFIX+i;
d.querySelector('.add').onclick=function(){file.click()};file.onchange=function(){var f=file.files&&file.files[0];if(!f)return;compress(f,function(data){savePhoto(key,data,function(ok){if(!ok){toast('写真を保存できませんでした');return}showPhoto(mem,data);if(!localStorage.getItem(key+':xp')){localStorage.setItem(key+':xp','1');set(EXP,num(EXP)+100);refresh();result(100,0)}else toast('📸 写真を更新したよ！')})})};
d.querySelector('.moneyrow button').onclick=function(){var input=d.querySelector('.moneyrow input'),n=parseInt(input.value.replace(/[^0-9]/g,''),10);if(!n||n<1){toast('金額を入力してね');return}set(SPENT,num(SPENT)+n);set(COIN,num(COIN)+n);var log=[];try{log=JSON.parse(localStorage.getItem('einana-spent-log-v1')||'[]');if(!Array.isArray(log))log=[]}catch(e){}log.push({date:new Date().toISOString(),amount:n,place:q[1]});localStorage.setItem('einana-spent-log-v1',JSON.stringify(log));input.value='';refresh();result(0,n)};
getPhoto(key,function(data){if(data)showPhoto(mem,data)})});
function showPhoto(mem,data){mem.classList.add('done');mem.querySelector('.memstatus').textContent='おもいで記録済み ✓';var img=mem.querySelector('img');if(!img){img=document.createElement('img');mem.appendChild(img)}img.src=data}
function savePhoto(k,data,cb){if(!db){cb(false);return}var tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(data,k);tx.oncomplete=function(){cb(true)};tx.onerror=function(){cb(false)}}
function getPhoto(k,cb){if(!db){cb(null);return}var r=db.transaction('photos').objectStore('photos').get(k);r.onsuccess=function(){cb(r.result||null)};r.onerror=function(){cb(null)}}
function compress(file,cb){var reader=new FileReader();reader.onload=function(){var im=new Image();im.onload=function(){var w=im.width,h=im.height,s=Math.min(1,1200/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};im.onerror=function(){toast('写真を読み込めませんでした')};im.src=reader.result};reader.readAsDataURL(file)}
try{var req=indexedDB.open(DB,1);req.onupgradeneeded=function(e){if(!e.target.result.objectStoreNames.contains('photos'))e.target.result.createObjectStore('photos')};req.onsuccess=function(e){db=e.target.result;QUESTS.forEach(function(q,i){getPhoto(PREFIX+i,function(data){if(data)showPhoto(root.children[i].querySelector('.memory'),data)})})}}catch(e){}
el('resultOk').onclick=function(){el('overlay').classList.remove('show')};el('menuBtn').onclick=function(){el('shade').classList.add('show')};el('close').onclick=function(){el('shade').classList.remove('show')};el('shade').onclick=function(e){if(e.target===el('shade'))el('shade').classList.remove('show')};localStorage.setItem('einana-last-diary','kyoto');refresh();window.addEventListener('pageshow',refresh);
})();
</script></body></html>
