<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>えいなな 妖怪ガチャ</title><style>
*{box-sizing:border-box}body{margin:0;background:#08346f;color:#132449;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif}.app{max-width:690px;margin:auto;min-height:100vh;background:radial-gradient(ellipse at 50% 32%,#84dfff,#168bd4 53%,#083a84 100%);padding:12px 12px 90px}header{background:linear-gradient(135deg,#fff8bf,#ffc653);border:4px solid #fff;border-radius:25px;padding:14px 16px;box-shadow:0 5px #0c4c88;display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:clamp(24px,6vw,39px);color:#072a68;text-shadow:2px 2px #fff}h1 small{display:block;font-size:12px}a{color:inherit;text-decoration:none}.back{background:#253eb8;color:white;padding:10px 12px;border:3px solid white;border-radius:18px;font-weight:900}.wallet{display:flex;gap:7px;margin:12px 0}.wallet>div{flex:1;min-width:0;background:#06284d;color:white;border:3px solid #ffdf52;border-radius:15px;text-align:center;padding:9px 2px;font-size:12px;font-weight:900}.wallet strong{display:block;color:#ffe566;font-size:clamp(16px,4vw,24px)}.intro{background:#ffffffdf;border:4px solid #fff;border-radius:22px;padding:10px 14px;font-weight:900;line-height:1.5}.machine{position:relative;display:grid;place-items:center;min-height:310px;margin:12px auto;background:linear-gradient(155deg,#a4e5ff99,#fff0b688);border:5px solid #fff;border-radius:30px;overflow:hidden}.machine:before{content:'✦　✧　✦　✧　✦';position:absolute;top:10px;color:#ffdf43;font-size:35px}.glass{position:relative;margin-top:12px;width:235px;height:205px;border:11px solid #e3f5ff;border-radius:120px 120px 72px 72px;background:radial-gradient(circle at 20% 20%,#fff9,transparent 32%),radial-gradient(circle at 80% 40%,#ff9be0,#65cfff 65%,#3180d4);box-shadow:inset 0 0 16px #133c85,0 6px #0a5e9b;overflow:hidden}.ball{position:absolute;width:63px;height:63px;border-radius:50%;border:4px solid #fff9;box-shadow:inset -7px -10px 10px #0003,2px 4px #152a6e44}.ball:after{content:'';position:absolute;top:26px;left:0;right:0;border-top:4px solid #ffffff99}.base{width:250px;height:70px;margin-top:-3px;background:linear-gradient(#ff6b60,#d62248);border:7px solid #fff2ae;border-radius:12px 12px 35px 35px;box-shadow:0 7px #a11b44;text-align:center;color:white;font-weight:1000;padding:14px;font-size:23px}.mode{display:flex;gap:8px;justify-content:center;margin:12px}.mode button{border:3px solid #fff;background:#2457a5;color:#fff;padding:10px 17px;border-radius:20px;font-weight:900}.mode button.active{background:#ffe36e;color:#142750;border-color:#d9862c}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button{border:5px solid #fff;border-radius:24px;color:white;padding:14px 5px;background:linear-gradient(#ff5a9d,#dc1261);box-shadow:0 6px #922b7e;font-size:clamp(17px,4.2vw,24px);font-weight:1000}.actions button:nth-child(2){background:linear-gradient(#9273ff,#5730cc);box-shadow:0 6px #39258a}.actions small{display:block;font-size:13px}.panel{margin-top:16px;background:#fff;border:5px solid #9eeaff;border-radius:25px;padding:14px}.panel h2{font-size:20px;margin:0 0 10px;color:#143b84}.preview{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.preview figure{margin:0;background:#e9f6ff;border-radius:10px;overflow:hidden;text-align:center}.preview img{width:100%;aspect-ratio:1;object-fit:contain}.preview figcaption{font-size:10px;font-weight:900;line-height:1.3;padding:3px}.foot{position:fixed;bottom:0;left:0;right:0;background:#062954f0;display:flex;gap:5px;justify-content:center;padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:5}.foot a{flex:1;max-width:180px;background:#fff9df;border-radius:14px;text-align:center;padding:12px 2px;font-size:12px;font-weight:900}.overlay{display:none;position:fixed;inset:0;background:#00152edc;z-index:10;align-items:center;justify-content:center;padding:12px}.overlay.show{display:flex}.result{width:min(500px,98vw);max-height:88vh;overflow:auto;background:linear-gradient(#fff6c0,#e5f6ff);border:6px solid white;border-radius:28px;padding:15px;text-align:center}.result h2{margin:0;color:#153978}.results{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:10px 0}.results figure{margin:0;background:white;border:2px solid #d2c7e7;border-radius:13px;padding:3px}.results img{width:100%;aspect-ratio:1;object-fit:contain}.results figcaption{font-size:10px;font-weight:900}.result button{background:linear-gradient(#ff74ae,#e72777);color:white;border:4px solid white;border-radius:24px;padding:12px 36px;font-size:20px;font-weight:900}
</style></head><body><div class="app"><header><div><h1><small>えいなな旅行</small>🔮 妖怪ガチャ</h1>オリジナル妖怪20体＋経験値玉</div><a class="back" href="menu.html">☰ メニュー</a></header><div class="wallet"><div>⭐ けいけんち<strong id="exp">0</strong></div><div>💰 たびマネー<strong id="money">0P</strong></div></div><div class="intro">旅の思い出から生まれた妖怪たち！<br>どんな仲間が出るかは回してからのお楽しみ✨</div><div class="machine"><div><div class="glass" id="balls"></div><div class="base">✨ えいななガチャ ✨</div></div></div><div class="mode"><button id="moneyMode" class="active">💰 たびマネー</button><button id="expMode">⭐ EXP</button></div><div class="actions"><button id="one">🎰 1回まわす<small>500P / 500 EXP</small></button><button id="ten">🎉 10回まわす<small>4,500P / 4,500 EXP</small></button></div><div class="panel"><h2>👻 ガチャで出る妖怪（全20体）</h2><div class="preview" id="preview"></div><p style="font-size:12px;margin:10px 0 0">※経験値玉は4種類そのまま。集めた妖怪は「もちもの」で見られるよ。</p></div></div><nav class="foot"><a href="menu.html">📖 にっき</a><a href="inventory.html">🎒 もちもの</a><a href="album.html">📸 アルバム</a><a href="money.html">💰 おかね</a></nav><div class="overlay" id="overlay"><div class="result"><h2 id="heading">ガチャの結果</h2><div id="results" class="results"></div><p id="resultNote"></p><button id="close">Ⓐ とじる</button></div></div><script src="yokai-data.js"></script><script>
(()=>{'use strict';const A=window.EINANA_GACHA_ITEMS||[],K='einana-gacha-inventory-v2',M='einana-game-money-v1',E='einana-total-exp-v1';const $=x=>document.getElementById(x);let mode='money';const fmt=x=>Number(x).toLocaleString('ja-JP');function num(k){const x=Number(localStorage.getItem(k)||0);return Number.isFinite(x)&&x>0?Math.floor(x):0}function refresh(){$('money').textContent=fmt(num(M))+'P';$('exp').textContent=fmt(num(E));$('moneyMode').classList.toggle('active',mode==='money');$('expMode').classList.toggle('active',mode==='exp')};function bag(){try{return JSON.parse(localStorage.getItem(K)||'{}')||{}}catch(e){return {}}}function pick(){let r=Math.random(),rar=r<.015?'神レア':r<.075?'超レア':r<.23?'Sレア':r<.52?'レア':'ノーマル';let pool=A.filter(a=>a.rarity===rar);return pool[Math.floor(Math.random()*pool.length)]}function spin(n,cost){let k=mode==='money'?M:E,old=num(k);if(old<cost){alert((mode==='money'?'たびマネー':'EXP')+'が足りないよ！');return}let won=Array.from({length:n},pick),b=bag();try{localStorage.setItem(k,String(old-cost));won.forEach(a=>b[a.id]=(Number(b[a.id])||0)+1);localStorage.setItem(K,JSON.stringify(b))}catch(e){alert('保存できなかったよ。空き容量を確認してね');return}refresh();$('heading').textContent=n===1?'✨ 妖怪ガチャの結果！':'🎉 10連ガチャの結果！';$('results').innerHTML=won.map(a=>'<figure><img src="'+a.img+'" alt=""><figcaption>'+a.name+'<br>'+a.rarity+'</figcaption></figure>').join('');$('resultNote').textContent=won.filter(x=>x.kind==='yokai').length+'体の妖怪をGET！';$('overlay').classList.add('show')};$('one').onclick=()=>spin(1,500);$('ten').onclick=()=>spin(10,4500);$('moneyMode').onclick=()=>{mode='money';refresh()};$('expMode').onclick=()=>{mode='exp';refresh()};$('close').onclick=()=>$('overlay').classList.remove('show');$('preview').innerHTML=A.filter(a=>a.kind==='yokai').map(a=>'<figure><img loading="lazy" src="'+a.img+'"><figcaption>'+a.name+'</figcaption></figure>').join('');const balls=$('balls');for(let i=0;i<13;i++){let b=document.createElement('i');b.className='ball';b.style.left=(9+(i*43)%166)+'px';b.style.top=(18+(i*29)%110)+'px';b.style.background=['#ff5a91','#ffd34c','#6c9fff','#8a64ed','#73e3b0'][i%5];balls.append(b)}refresh()})();
</script></body></html>
