<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>妖怪ガシャ | えいなな旅行</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;color:#fff;background:radial-gradient(circle at top,#2767a3,#101c43 65%,#0b1731)}a{color:inherit}.top{max-width:680px;margin:auto;padding:14px;display:flex;gap:10px;justify-content:space-between;align-items:center}.top a{background:#ffdb61;color:#17244a;text-decoration:none;padding:9px 13px;border-radius:20px;font-weight:900;border:3px solid #fff}.panel{max-width:680px;margin:8px auto 30px;padding:15px;background:#173967;border:5px solid #8bdcff;border-radius:22px;box-shadow:inset 0 0 0 3px #09244a,0 10px 25px #0006}.heading{color:#ffe680;text-shadow:2px 3px #763e13;text-align:center;font-size:26px;margin:6px 0 12px}.stats{text-align:center;background:#092549;border-radius:16px;padding:10px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:15px}.slot{border:3px solid #a4c6ff;background:linear-gradient(#336da0,#102b56);border-radius:15px;min-height:142px;color:white;padding:7px 3px;display:flex;align-items:center;flex-direction:column;justify-content:center;gap:4px;font-weight:800}.slot:active{transform:scale(.97)}.slot.lock{filter:saturate(.55);border-color:#59718f}.medal{height:74px;width:74px;border:6px ridge #e4c67b;border-radius:50%;display:grid;place-items:center;font-size:38px;background:radial-gradient(circle,#f7f2bf,#f7bd50 60%,#93601b);box-shadow:0 3px 10px #0009}.lock .medal{background:#263b59;border-color:#54617b;filter:grayscale(1)}.slot small{font-size:10px;color:#ffedb0}.name{font-size:12px}.detail{margin-top:14px;padding:13px;background:#0b244a;border:2px solid #80caff;border-radius:15px;text-align:center;min-height:65px}.seal{margin:12px 0;padding:12px;background:#0d2b52;border:3px solid #d9af58;border-radius:18px}.seal h3{margin:0 0 7px;color:#ffe38c}.seal .needs{font-size:13px;line-height:1.9}.unlock{background:#ffdf69;color:#432c07;border:0;border-radius:20px;font-weight:900;padding:10px 20px;margin-top:8px}.unlock:disabled{background:#55627c;color:#ddd}.note{font-size:12px;opacity:.8;text-align:center}#stage{position:relative;max-width:610px;width:100%;aspect-ratio:610/665;margin:auto;background:url('gacha-bg.jpg') center/100% 100% no-repeat;overflow:hidden}.quick{position:absolute;top:2%;left:2%;display:flex;gap:4px}.quick a{font-size:12px;background:white;color:#152a4c;border:3px solid #14365c;padding:6px;border-radius:15px;text-decoration:none;font-weight:900}#status{position:absolute;top:3%;right:2%;background:#102a4be8;padding:7px;border:2px solid white;border-radius:14px;font-size:12px;font-weight:900}#mode{position:absolute;top:13%;left:50%;transform:translateX(-50%);display:flex;background:#0b234b;border:2px solid white;border-radius:18px;padding:3px}#mode button{border:0;border-radius:12px;padding:7px;font-weight:900;white-space:nowrap}#mode .active{background:#ffdd50}#oneBtn,#tenBtn{position:absolute;bottom:6.5%;width:43%;height:16%;background:transparent;border:0}#oneBtn{left:3%}#tenBtn{right:3%}#overlay{display:none;position:fixed;inset:0;z-index:999;background:#071631ec;align-items:center;justify-content:center;padding:12px}#overlay.show{display:flex}#scene{position:relative;overflow:hidden;width:min(440px,96vw);min-height:560px;border:6px solid #fff4c5;border-radius:25px;background:radial-gradient(circle at 50% 34%,#6fd1fb,#2656a2 53%,#0c2b61);text-align:center;padding:16px;box-shadow:0 0 35px #ffd65caa}#scene:before{content:'';position:absolute;inset:0;opacity:.2;background:url('gacha-bg.jpg') center/cover;pointer-events:none}#scene>*{position:relative}#phase{font-size:25px;font-weight:1000;color:#ffe581;text-shadow:2px 3px #6b3c16}#capsule{font-size:110px;margin:35px auto 8px;animation:shake .55s infinite alternate}#hero{display:none;margin:20px auto 0;width:175px;height:175px;border:8px ridge #ffdc79;border-radius:50%;background:radial-gradient(#fff6c8,#f4b348);font-size:105px;align-items:center;justify-content:center;animation:appear .7s both}#speech{display:none;margin:16px auto 0;background:white;color:#173159;border:4px solid #ffd36b;border-radius:22px;padding:16px;font-size:20px;font-weight:900;min-height:75px}#joined{display:none;font-weight:1000;color:#fff2a4;font-size:25px;margin:20px 0;text-shadow:2px 3px #723d16}#spinmedal{display:none;width:110px;height:110px;margin:14px auto;border:9px ridge #fbe093;border-radius:50%;background:radial-gradient(#fff2b3,#f3aa31);font-size:62px;align-items:center;justify-content:center;animation:coinspin .7s linear infinite}#register{display:none;background:#0d376d;border:3px solid #b3eaff;border-radius:16px;padding:13px;font-weight:900;margin:15px 0}#next{display:none;margin:20px auto 4px;background:#ffe16e;border:4px solid white;color:#233c61;border-radius:20px;padding:11px 28px;font-size:19px;font-weight:900}#skip{margin:12px auto 0;display:block;background:#183e6e;color:white;border:1px solid #b5d9f3;border-radius:12px;padding:7px 14px}#counter{font-size:13px;color:#d9eaff}@keyframes shake{from{transform:translateX(-13px) rotate(-13deg)}to{transform:translateX(13px) rotate(13deg)}}@keyframes appear{from{transform:scale(.15);opacity:0}to{transform:scale(1);opacity:1}}@keyframes coinspin{0%{transform:rotateY(0) scale(1)}80%{transform:rotateY(900deg) scale(.65)}100%{transform:rotateY(1080deg) scale(.15);opacity:.15}}@media(prefers-reduced-motion:reduce){#capsule,#hero,#spinmedal{animation-duration:.01ms}}</style></head><body><div id="stage"><nav class="quick"><a href="menu.html">📖 にっき</a><a href="zukan.html">📘 大辞典</a><a href="inventory.html">🎒 もちもの</a></nav><div id="status">💰 <span id="money">0</span>P<br>EXP <span id="exp">0</span></div><div id="mode"><button id="moneyMode" class="active">たびマネー</button><button id="expMode">EXP</button></div><button id="oneBtn" aria-label="1回まわす"></button><button id="tenBtn" aria-label="10回まわす"></button></div><div id="overlay" role="dialog" aria-modal="true" aria-label="ガシャ結果"><div id="scene"><div id="counter"></div><div id="phase">ガシャガシャ…！</div><div id="capsule">🔮</div><div id="hero"></div><div id="speech"></div><div id="joined"></div><div id="spinmedal"></div><div id="register"></div><button id="next">つぎへ ▶</button><button id="skip">演出をスキップ</button></div></div><script src="yokai-data.js"></script><script src="yokai-shared.js"></script><script>(function(){const M='einana-game-money-v1',E='einana-total-exp-v1',I='einana-gacha-inventory-v2',orbs=[{id:'xp50',name:'けいけんちだま・小',rarity:'ノーマル',img:'xp50.webp'},{id:'xp200',name:'けいけんちだま・中',rarity:'レア',img:'xp200.webp'},{id:'xp500',name:'けいけんちだま・大',rarity:'超レア',img:'xp500.webp'},{id:'xp1000',name:'けいけんちだま・極',rarity:'神レア',img:'xp1000.webp'}];let mode='money',queue=[],current=0,timers=[],busy=false;const $=id=>document.getElementById(id),num=k=>Number(localStorage.getItem(k)||0)||0;function refresh(){$('money').textContent=num(M).toLocaleString();$('exp').textContent=num(E).toLocaleString();$('moneyMode').classList.toggle('active',mode==='money');$('expMode').classList.toggle('active',mode==='exp')}function pick(){if(Math.random()<.19)return {orb:orbs[Math.floor(Math.random()*orbs.length)]};const pool=EINANA_YOKAI.filter(y=>!y.legend),weights=pool.map(y=>y.rank==='S'?1:y.rank==='A'?2:y.rank==='B'?3:y.rank==='C'?5:8),sum=weights.reduce((a,b)=>a+b,0);let r=Math.random()*sum;for(let i=0;i<pool.length;i++){r-=weights[i];if(r<0)return {y:pool[i]}}return {y:pool[0]}}function later(fn,ms){timers.push(setTimeout(fn,ms))}function clear(){timers.forEach(clearTimeout);timers=[]}function hideParts(){['capsule','hero','speech','joined','spinmedal','register','next'].forEach(id=>$(id).style.display='none')}function finish(){clear();$('overlay').classList.remove('show');busy=false;refresh()}function next(){clear();if(current>=queue.length){finish();return}const prize=queue[current++];hideParts();$('counter').textContent=`${current} / ${queue.length}`;$('phase').textContent='ガシャガシャ…！';$('capsule').style.display='block';$('capsule').textContent='🔮';$('skip').style.display='block';later(()=>{hideParts();$('phase').textContent='カプセルが ひらいた！';$('hero').style.display='flex';if(prize.y){$('hero').textContent=prize.y.emoji;$('speech').textContent=`「${prize.y.line}」`;later(()=>{$('speech').style.display='block';$('phase').textContent=prize.y.name+' が あらわれた！'},600);later(()=>{$('joined').textContent=prize.y.name+' が ともだちになった！';$('joined').style.display='block'},1550);later(()=>{$('spinmedal').textContent=prize.y.emoji;$('spinmedal').style.display='flex';$('phase').textContent='妖怪メダルが回転！'},2600);later(()=>{EinanaDex.add(prize.y.id);$('spinmedal').style.display='none';$('register').textContent=prize.y.name+' を 妖怪大辞典に登録した！';$('register').style.display='block';$('phase').textContent='📖 大辞典 登録！';$('next').style.display='block'},3550)}else{const orb=prize.orb;$('hero').innerHTML='';const img=document.createElement('img');img.src=orb.img;img.alt=orb.name;img.style.cssText='width:125px;height:125px;object-fit:contain';$('hero').append(img);$('joined').textContent=orb.name+' を GET！';$('joined').style.display='block';$('phase').textContent='アイテム GET！';$('next').style.display='block'}},850)}function spin(count,cost){if(busy)return;const k=mode==='money'?M:E,n=num(k);if(n<cost){alert(mode==='money'?'たびマネーがたりない！':'けいけんちがたりない！');return}busy=true;localStorage.setItem(k,String(n-cost));queue=Array.from({length:count},pick);current=0;let bag;try{bag=JSON.parse(localStorage.getItem(I)||'{}')}catch(e){bag={}}queue.forEach(p=>{if(p.orb)bag[p.orb.id]=(bag[p.orb.id]||0)+1});localStorage.setItem(I,JSON.stringify(bag));refresh();$('overlay').classList.add('show');next()}$('oneBtn').onclick=()=>spin(1,500);$('tenBtn').onclick=()=>spin(10,4500);$('moneyMode').onclick=()=>{mode='money';refresh()};$('expMode').onclick=()=>{mode='exp';refresh()};$('next').onclick=next;$('skip').onclick=()=>{clear();for(let i=current-1;i<queue.length;i++)if(queue[i].y)EinanaDex.add(queue[i].y.id);finish()};refresh()})();</script></body></html>
