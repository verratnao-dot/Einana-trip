<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ガチャガチャ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#173d24;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}
#stage{
 position:relative;width:100%;max-width:610px;margin:auto;
 aspect-ratio:610/665;background:url("./gacha-bg.jpg") center/100% 100% no-repeat;
 overflow:hidden
}
.gachaBtn{
 position:absolute;z-index:50;border:0;background:rgba(255,255,255,.001);
 -webkit-appearance:none;appearance:none;touch-action:manipulation;cursor:pointer
}
#oneBtn{left:3%;bottom:6.5%;width:43%;height:16%}
#tenBtn{right:3%;bottom:6.5%;width:43%;height:16%}
#backBtn{right:0;bottom:0;width:24%;height:7%}
#status{
 position:absolute;z-index:60;right:2%;top:2%;padding:5px 10px;
 border:2px solid #c9ecff;border-radius:18px;background:#102844e8;color:#fff;
 font-weight:900;font-size:12px
}
#mode{
 position:absolute;z-index:60;left:50%;top:13%;transform:translateX(-50%);
 display:flex;background:#102844e8;border:2px solid white;border-radius:18px;padding:3px
}
#mode button{border:0;border-radius:13px;padding:6px 9px;font-weight:900}
#moneyMode.active,#expMode.active{background:#ffe34c}
#result{
 display:none;position:fixed;z-index:999;inset:0;background:rgba(0,0,0,.72);
 align-items:center;justify-content:center;padding:18px
}
#result.show{display:flex}
#card{
 width:min(420px,94vw);background:linear-gradient(#86ec67,#d9ff9d);
 border:6px solid white;border-radius:26px;text-align:center;padding:20px;
 box-shadow:0 8px 30px #0008
}
#rarity{font-size:30px;font-weight:1000;color:#ffde22;text-shadow:2px 2px #333}
#itemImg{width:160px;height:160px;object-fit:contain}
#itemName{font-size:24px;font-weight:1000;margin:6px}
#okBtn{border:3px solid #777;background:white;border-radius:22px;padding:10px 38px;font-weight:1000;font-size:18px}
</style>
</head>
<body>
<div id="stage">
 <div id="status">🪙 <span id="money">10000</span>P<br>EXP <span id="exp">10000</span></div>
 <div id="mode">
   <button id="moneyMode" class="active" type="button">たびマネー</button>
   <button id="expMode" type="button">EXP</button>
 </div>
 <button id="oneBtn" class="gachaBtn" type="button" aria-label="1回まわす"></button>
 <button id="tenBtn" class="gachaBtn" type="button" aria-label="10回まわす"></button>
 <button id="backBtn" class="gachaBtn" type="button" aria-label="もどる"></button>
</div>

<div id="result">
 <div id="card">
  <div id="rarity"></div>
  <img id="itemImg" alt="">
  <div id="itemName"></div>
  <p id="resultText"></p>
  <button id="okBtn" type="button">A OK</button>
 </div>
</div>

<script>
(function(){
"use strict";

var MONEY_KEY="einana-game-money-v1";
var EXP_KEY="einana-total-exp-v1";
var INV_KEY="einana-gacha-inventory-v2";
var mode="money";

var items=[
 {id:"bandage",name:"絆創膏",rarity:"ノーマル",img:"./bandage.webp"},
 {id:"candy",name:"飴ちゃん",rarity:"ノーマル",img:"./candy.webp"},
 {id:"ecobag",name:"エコバッグ",rarity:"ノーマル",img:"./ecobag.webp"},
 {id:"guidebook",name:"ガイドブック",rarity:"ノーマル",img:"./guidebook.webp"},
 {id:"cookie",name:"お土産クッキー",rarity:"レア",img:"./cookie.webp"},
 {id:"ferris_ticket",name:"観覧車チケット",rarity:"レア",img:"./ferris_ticket.webp"},
 {id:"local_drink",name:"ご当地ドリンク",rarity:"レア",img:"./local_drink.webp"},
 {id:"551",name:"551の豚まん",rarity:"Sレア",img:"./551.webp"},
 {id:"kinkaku",name:"金閣寺お守り",rarity:"Sレア",img:"./kinkaku.webp"},
 {id:"kyoto_pouch",name:"京都の和雑貨",rarity:"Sレア",img:"./kyoto_pouch.webp"},
 {id:"hotel_ticket",name:"ホテル宿泊券",rarity:"超レア",img:"./hotel_ticket.webp"},
 {id:"couple_plush",name:"ペアお揃いぬいぐるみ",rarity:"超レア",img:"./couple_plush.webp"},
 {id:"gold_charm",name:"金の御守り",rarity:"神レア",img:"./gold_charm.webp"}
];

function el(id){return document.getElementById(id)}
function readNum(key,starter){
 var v=localStorage.getItem(key);
 if(v===null){localStorage.setItem(key,String(starter));return starter}
 v=parseInt(v,10); return isNaN(v)?starter:v;
}
function writeNum(key,v){localStorage.setItem(key,String(Math.max(0,v)))}
function inventory(){
 try{return JSON.parse(localStorage.getItem(INV_KEY)||"{}")}catch(e){return {}}
}
function saveInventory(x){localStorage.setItem(INV_KEY,JSON.stringify(x))}
function refresh(){
 el("money").textContent=readNum(MONEY_KEY,10000).toLocaleString();
 el("exp").textContent=readNum(EXP_KEY,10000).toLocaleString();
 el("moneyMode").className=mode==="money"?"active":"";
 el("expMode").className=mode==="exp"?"active":"";
}
function choose(){
 var r=Math.random(),rarity;
 if(r<0.01) rarity="神レア";
 else if(r<0.07) rarity="超レア";
 else if(r<0.22) rarity="Sレア";
 else if(r<0.50) rarity="レア";
 else rarity="ノーマル";
 var pool=items.filter(function(x){return x.rarity===rarity});
 return pool[Math.floor(Math.random()*pool.length)];
}
function spin(count,cost){
 var key=mode==="money"?MONEY_KEY:EXP_KEY;
 var current=readNum(key,10000);
 if(current<cost){
   alert(mode==="money"?"たびマネーがたりない！":"けいけんちがたりない！");
   return;
 }
 writeNum(key,current-cost);
 var bag=inventory(), won=[], i;
 for(i=0;i<count;i++){
   var item=choose();
   won.push(item);
   bag[item.id]=(bag[item.id]||0)+1;
 }
 saveInventory(bag);
 refresh();
 var best=won[0];
 var order={"ノーマル":0,"レア":1,"Sレア":2,"超レア":3,"神レア":4};
 for(i=1;i<won.length;i++) if(order[won[i].rarity]>order[best.rarity]) best=won[i];
 el("rarity").textContent=best.rarity+"！";
 el("itemImg").src=best.img;
 el("itemName").textContent=best.name;
 el("resultText").textContent=count===1?"アイテムをGET！":"10個のアイテムをGET！";
 el("result").className="show";
}
el("oneBtn").onclick=function(e){e.preventDefault();spin(1,500)};
el("tenBtn").onclick=function(e){e.preventDefault();spin(10,4500)};
el("moneyMode").onclick=function(){mode="money";refresh()};
el("expMode").onclick=function(){mode="exp";refresh()};
el("okBtn").onclick=function(){el("result").className=""};
el("backBtn").onclick=function(){location.href="./inventory.html"};
refresh();
})();
</script>
</body>
</html>
