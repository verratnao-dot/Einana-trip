<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ガチャガチャ</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#10261a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN",sans-serif}
.stage{position:relative;width:min(100vw,610px);aspect-ratio:610/665;margin:auto;background:url("gacha-bg.jpg") center/100% 100% no-repeat;overflow:hidden}
.status{position:absolute;right:2.8%;top:2.2%;width:34%;display:flex;flex-direction:column;gap:5px;z-index:5}
.pill{background:#172554e8;border:2px solid #d9efff;border-radius:18px;color:white;padding:4px 9px;text-align:center;font-size:clamp(10px,2.8vw,16px);font-weight:1000;box-shadow:0 2px 6px #0007}
.pill b{color:#ffe23d}.pay{position:absolute;left:4%;right:4%;bottom:16.2%;display:flex;gap:8px;z-index:6}
.pay button{flex:1;border:3px solid white;border-radius:16px;padding:7px 3px;font-weight:1000;font-size:clamp(10px,3vw,16px);box-shadow:0 4px #3f4776}
.pay .active{background:#ffe55d}.pay button:not(.active){background:#d9edff}
.hit{position:absolute;bottom:7.2%;height:10.8%;border:0;background:transparent;z-index:7;color:transparent}
.hit.one{left:5%;width:40%}.hit.ten{right:5%;width:40%}
.menu{position:absolute;right:2.5%;bottom:1.5%;z-index:8;border:3px solid white;border-radius:50%;width:44px;height:44px;background:#234d9b;color:white;font-size:22px}
#result{display:none;position:fixed;inset:0;background:#000b;z-index:50;align-items:center;justify-content:center;padding:14px}
#result.show{display:flex}.card{width:min(440px,94vw);background:radial-gradient(circle,#b8ff7c,#42cf49);border:6px solid white;border-radius:24px;padding:18px;text-align:center;color:#171717}
.rare{font-size:31px;font-weight:1000;color:#ffe72e;-webkit-text-stroke:2px #222}.capsule{display:flex;align-items:center;justify-content:center;margin:8px}
.half{width:67px;height:67px;border:5px solid #fff9;border-radius:70px 70px 10px 10px;transform:rotate(-35deg);margin:0 6px}.half.r{transform:rotate(145deg)}
.silver{background:#bdc6d1}.blue{background:#1875ee}.red{background:#ef3348}.gold{background:#e8ae20}.black{background:#080808;box-shadow:0 0 14px #df67ff}
.icon{font-size:70px}.name{font-size:23px;font-weight:1000}.ok{padding:10px 34px;border:3px solid #777;border-radius:20px;background:white;font-weight:1000}
.drawer{display:none;position:fixed;inset:0;background:#0009;z-index:40}.drawer.show{display:block}.panel{position:absolute;right:12px;top:70px;width:270px;padding:12px;border:4px solid white;border-radius:20px;background:#55bdf0}.panel a{display:inline-block;width:47%;margin:1%;padding:13px 3px;border-radius:13px;background:white;text-align:center;color:#14224d;text-decoration:none;font-weight:900}
.note{max-width:610px;margin:auto;background:#fff6cf;padding:10px 14px;font-size:12px;font-weight:700}
</style>
</head>
<body>
<div class="stage">
  <div class="status"><div class="pill">🪙 <b id="money">0P</b></div><div class="pill">EXP <b id="exp">0</b></div></div>
  <div class="pay"><button id="pm" class="active" onclick="pay='money';sync()">🪙 たびマネーで回す</button><button id="pe" onclick="pay='exp';sync()">EXPで回す</button></div>
  <button class="hit one" aria-label="1回まわす" onclick="pull(1,500)">1回</button>
  <button class="hit ten" aria-label="10回まわす" onclick="pull(10,4500)">10回</button>
  <button class="menu" onclick="drawer.classList.add('show')">☰</button>
</div>
<div class="note">画像の「1回まわす」「10回まわす」をそのままタップできるよ。支払いは上のボタンで、たびマネー／EXPを切り替え！</div>

<div id="result"><div class="card" id="card"></div></div>
<div class="drawer" id="drawer" onclick="if(event.target===this)this.classList.remove('show')"><div class="panel">
<a href="inventory.html">🎒 もちもの</a><a href="gacha.html">🎰 ガチャ</a><a href="menu.html">📖 にっき</a><a href="map-kyoto.html">🗺️ MAP</a>
</div></div>

<script>
const MONEY='einana-game-money-v1', EXP='einana-total-exp-v1', INV='einana-gacha-inventory-v2';
const ITEMS=[
{id:'snack',n:'おやつ券',r:'ノーマル',col:'silver',icon:'🍭',d:'旅行中のおやつタイムに使える券。'},
{id:'photo',n:'写真ポーズ指定券',r:'ノーマル',col:'silver',icon:'📸',d:'次の写真のポーズを決められる券。'},
{id:'drink',n:'ドリンク券',r:'ノーマル',col:'silver',icon:'🥤',d:'休憩タイムに使えるドリンク券。'},
{id:'food',n:'食べ歩き券',r:'レア',col:'blue',icon:'🍡',d:'食べ歩きで好きなものを選べる券。'},
{id:'wish',n:'お願いできる券',r:'レア',col:'blue',icon:'💌',d:'相手にかわいいお願いを1つできる券。'},
{id:'date',n:'デート先決定券',r:'Sレア',col:'red',icon:'🎡',d:'次のデート先を決められる特別な券。'},
{id:'key',n:'思い出キーホルダー',r:'Sレア',col:'red',icon:'🔑',d:'旅の思い出を残す記念アイテム。'},
{id:'reward',n:'スペシャルごほうび券',r:'超レア',col:'gold',icon:'👑',d:'2人だけの特別なごほうび券。'},
{id:'night',n:'大阪の夜景キーホルダー',r:'神レア',col:'black',icon:'🌃',d:'夜景の思い出がつまった最高レアアイテム。'},
{id:'xp50',n:'けいけんちだま・小',r:'ノーマル',col:'silver',icon:'🔵',xp:50,d:'使うと けいけんち +50。'},
{id:'xp200',n:'けいけんちだま・中',r:'レア',col:'blue',icon:'🔥',xp:200,d:'使うと けいけんち +200。'},
{id:'xp500',n:'けいけんちだま・大',r:'超レア',col:'gold',icon:'🔮',xp:500,d:'使うと けいけんち +500。'},
{id:'xp1000',n:'けいけんちだま・極',r:'神レア',col:'black',icon:'🌈',xp:1000,d:'使うと けいけんち +1000。'}];
function num(k){return Number(localStorage.getItem(k)||0)}
function setn(k,v){localStorage.setItem(k,String(Math.max(0,v)))}
function inv(){try{return JSON.parse(localStorage.getItem(INV)||'{}')}catch(e){return {}}}
function save(v){localStorage.setItem(INV,JSON.stringify(v))}
function pick(){let x=Math.random(),r=x<.01?'神レア':x<.07?'超レア':x<.22?'Sレア':x<.50?'レア':'ノーマル';let p=ITEMS.filter(i=>i.r===r);return p[Math.floor(Math.random()*p.length)]}
let pay='money';
function sync(){money.textContent=num(MONEY).toLocaleString()+'P';exp.textContent=num(EXP).toLocaleString();pm.classList.toggle('active',pay==='money');pe.classList.toggle('active',pay==='exp')}
function pull(n,cost){let k=pay==='money'?MONEY:EXP;if(num(k)<cost){alert(pay==='money'?'たびマネーがたりない！':'けいけんちがたりない！');return}setn(k,num(k)-cost);sync();let v=inv(),got=[];for(let a=0;a<n;a++){let i=pick();got.push(i);v[i.id]=(v[i.id]||0)+1}save(v);let rank=['ノーマル','レア','Sレア','超レア','神レア'];got.sort((a,b)=>rank.indexOf(b.r)-rank.indexOf(a.r));setTimeout(()=>show(got[0],n),300)}
function show(i,n){card.innerHTML='<div class="rare">'+i.r+'！</div><div class="capsule"><i class="half '+i.col+'"></i><div class="icon">'+i.icon+'</div><i class="half r '+i.col+'"></i></div><div class="name">'+i.n+'</div><p>'+i.d+'</p><b>'+n+'個のアイテムをGET！</b><br><button class="ok" onclick="result.classList.remove(\\'show\\')">A OK</button>';result.classList.add('show')}
sync();
</script>
</body></html>
