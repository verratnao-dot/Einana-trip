<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>旅の思い出ガチャ</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN",sans-serif;color:#171717;background:linear-gradient(#78d6ff,#55bff4);min-height:100vh}.top{padding:14px 18px;background:#fff;border-bottom:5px solid #f7d442;font-size:27px;font-weight:1000}.money{position:absolute;right:12px;top:14px;background:#172554;color:#ffe73d;padding:8px 14px;border-radius:18px;font-weight:1000}.scene{max-width:560px;margin:auto;padding:22px 15px 40px;text-align:center}.tree{background:linear-gradient(#5f8d43,#345c2c);border:6px solid #7b5a34;border-radius:45% 45% 18px 18px;padding:28px 20px 35px;box-shadow:inset 0 0 30px #193b1c}.machine{margin:auto;width:230px;background:#66736b;border:6px solid #39433e;border-radius:15px;padding:12px;box-shadow:inset 0 0 12px #fff5}.glass{height:170px;background:#dffaffaa;border:5px solid #455;border-radius:10px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:5px;padding:12px}.cap{width:55px;height:55px;border-radius:50%;border:4px solid #fff8;box-shadow:inset -7px -7px 10px #0004}.silver{background:#bfc8d2}.blue{background:#1675ef}.red{background:#ef3340}.gold{background:#e7ad22}.black{background:#090909;box-shadow:inset -7px -7px 10px #555,0 0 10px #d946ef}.handle{width:80px;height:80px;border-radius:50%;background:#26332e;border:10px solid #4c5b54;margin:12px auto;position:relative}.handle:after{content:"";position:absolute;width:12px;height:55px;background:#111;left:24px;top:3px;border-radius:8px}.btns{display:flex;gap:12px;margin-top:18px}button,a.btn{flex:1;border:4px solid #fff;border-radius:20px;padding:13px 8px;font-size:18px;font-weight:1000;text-decoration:none;color:#171717;box-shadow:0 5px #453a76}button{background:#ff6f78}button.ten{background:#a873f2}.sub{display:flex;gap:10px;margin-top:18px}.sub a{flex:1;background:#fff;padding:12px;border-radius:15px;text-decoration:none;color:#111;font-weight:900}.rarity{margin-top:18px;background:#fff7d4;border:4px solid #f5cc54;border-radius:20px;padding:12px}.row{display:flex;justify-content:space-around;gap:5px}.mini{font-size:11px;font-weight:900}.mini .cap{width:43px;height:43px;margin:auto}#result{display:none;position:fixed;inset:0;background:#0009;align-items:center;justify-content:center;padding:15px;z-index:10}#result.show{display:flex}.panel{width:min(430px,96vw);background:linear-gradient(135deg,#62df4c,#b3f85c);border:5px solid white;border-radius:24px;padding:20px;text-align:center}.bigcap{width:105px;height:105px;margin:15px auto;border-radius:50%;border:7px solid #fff8}.rare{font-size:31px;font-weight:1000;color:#ffe63a;-webkit-text-stroke:2px #222}.item{font-size:23px;font-weight:1000}.close{margin-top:15px;background:white;width:60%;box-shadow:none}</style>
<style id="einana-common-menu-style">
.gameMenuBtn{position:fixed;right:12px;top:max(12px,env(safe-area-inset-top));z-index:9999;width:54px;height:54px;border-radius:50%;border:3px solid #fff;background:#243b82;color:#fff;font-size:25px;box-shadow:0 4px 12px #0007;display:flex;align-items:center;justify-content:center}
.gameMenuShade{position:fixed;inset:0;background:#0008;z-index:9998;display:none}.gameMenuShade.show{display:block}
.gameMenuPanel{position:absolute;right:12px;top:78px;width:min(290px,86vw);padding:14px;border:4px solid #fff;border-radius:22px;background:linear-gradient(145deg,#46c8ff,#5379ee);box-shadow:0 8px 28px #0008}
.gameMenuTitle{font-size:20px;font-weight:1000;color:#fff;margin:2px 5px 10px;text-shadow:2px 2px #28407c}
.gameMenuGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.gameMenuGrid a{display:block;text-decoration:none;text-align:center;padding:14px 6px;border:3px solid #fff;border-radius:15px;background:#fff6c9;color:#172554;font-weight:1000;box-shadow:0 3px #5a66a5}
.gameMenuGrid a:nth-child(2){background:#ffd2ec}.gameMenuGrid a:nth-child(3){background:#d7f7ff}.gameMenuGrid a:nth-child(4){background:#d9ffd5}
.gameMenuClose{width:100%;margin-top:10px;padding:10px;border:0;border-radius:13px;background:#26365f;color:#fff;font-weight:900}
</style>
</head>
<body><div class="top">ガチャガチャ</div><div class="money">🪙 <span id="m">0</span>P</div><div class="scene"><div class="tree"><h2>🌳 旅の思い出ガチャ</h2><div class="machine"><div class="glass"><i class="cap silver"></i><i class="cap blue"></i><i class="cap red"></i><i class="cap gold"></i><i class="cap black"></i></div><div class="handle"></div></div></div><div class="btns"><button onclick="pull(1,500)">1回まわす<br>500P</button><button class="ten" onclick="pull(10,4500)">10回まわす<br>4500P</button></div><div class="sub"><a href="inventory.html">🎒 もちもの</a><a href="menu.html">B もどる</a></div><div class="rarity"><b>カプセルのレア度</b><div class="row"><div class="mini"><i class="cap silver"></i>ノーマル</div><div class="mini"><i class="cap blue"></i>レア</div><div class="mini"><i class="cap red"></i>Sレア</div><div class="mini"><i class="cap gold"></i>超レア</div><div class="mini"><i class="cap black"></i>神レア</div></div></div></div><div id="result"><div class="panel" id="panel"></div></div>
<script>
const MONEY='einana-game-money-v1', INV='einana-gacha-inventory-v1';
const items=[
 {n:'おやつ券',r:'ノーマル',c:'silver',e:'旅行中のおやつタイムに使える券。'},
 {n:'写真ポーズ指定券',r:'ノーマル',c:'silver',e:'次の写真のポーズを決められる券。'},
 {n:'ドリンク券',r:'ノーマル',c:'silver',e:'休憩タイムのドリンク券。'},
 {n:'食べ歩き券',r:'レア',c:'blue',e:'食べ歩きで好きなものを1つ選べる券。'},
 {n:'お願いできる券',r:'レア',c:'blue',e:'相手にかわいいお願いを1つできる券。'},
 {n:'デート先決定券',r:'Sレア',c:'red',e:'次のデート先を決められる特別な券。'},
 {n:'思い出キーホルダー',r:'Sレア',c:'red',e:'旅行の思い出を残す記念アイテム。'},
 {n:'スペシャルごほうび券',r:'超レア',c:'gold',e:'2人だけの特別なごほうび券。'},
 {n:'大阪の夜景キーホルダー',r:'神レア',c:'black',e:'2人で見た夜景の思い出がつまった超特別アイテム。'}
];
function inv(){try{return JSON.parse(localStorage.getItem(INV)||'{}')}catch(e){return {}}}
function saveInv(x){localStorage.setItem(INV,JSON.stringify(x))}
function money(){return Number(localStorage.getItem(MONEY)||0)}
function setMoney(x){localStorage.setItem(MONEY,String(x))}

document.getElementById('m').textContent=money().toLocaleString();
function one(){let x=Math.random(), pool;if(x<.01)pool=items.filter(i=>i.r==='神レア');else if(x<.06)pool=items.filter(i=>i.r==='超レア');else if(x<.20)pool=items.filter(i=>i.r==='Sレア');else if(x<.48)pool=items.filter(i=>i.r==='レア');else pool=items.filter(i=>i.r==='ノーマル');return pool[Math.floor(Math.random()*pool.length)]}
function pull(n,cost){if(money()<cost){alert('たびマネーがたりない！');return}setMoney(money()-cost);document.getElementById('m').textContent=money().toLocaleString();let got=[],v=inv();for(let k=0;k<n;k++){let i=one();got.push(i);v[i.n]=(v[i.n]||0)+1}saveInv(v);let best=got.sort((a,b)=>['ノーマル','レア','Sレア','超レア','神レア'].indexOf(b.r)-['ノーマル','レア','Sレア','超レア','神レア'].indexOf(a.r))[0];document.getElementById('panel').innerHTML='<div class="rare">'+best.r+'！</div><div class="bigcap '+best.c+'"></div><div class="item">'+best.n+'</div><p>'+best.e+'</p><b>'+n+'個のアイテムをGET！</b><br><button class="close" onclick="document.getElementById(\'result\').classList.remove(\'show\')">A OK</button>';document.getElementById('result').classList.add('show')}
</script>
<button class="gameMenuBtn" id="gameMenuBtn" aria-label="ゲームメニュー">☰</button>
<div class="gameMenuShade" id="gameMenuShade"><div class="gameMenuPanel">
<div class="gameMenuTitle">🎮 ゲームメニュー</div>
<div class="gameMenuGrid">
<a href="inventory.html">🎒<br>もちもの</a>
<a href="gacha.html">🎰<br>ガチャ</a>
<a href="menu.html">📖<br>にっき選択</a>
<a href="#" id="mapLink">🗺️<br>この日のMAP</a>
</div>
<button class="gameMenuClose" id="gameMenuClose">B もどる</button>
</div></div>
<script id="einana-common-menu-script">
(function(){
 const shade=document.getElementById('gameMenuShade');
 document.getElementById('gameMenuBtn').onclick=()=>shade.classList.add('show');
 document.getElementById('gameMenuClose').onclick=()=>shade.classList.remove('show');
 shade.addEventListener('click',e=>{if(e.target===shade)shade.classList.remove('show')});
 const f=location.pathname.split('/').pop();
 let map='map-kyoto.html';
 if(f.includes('osaka1'))map='map-osaka1.html';
 else if(f.includes('osaka2'))map='map-osaka2.html';
 else if(f.includes('osaka3'))map='map-osaka3.html';
 else if(f==='gacha.html'||f==='inventory.html'){
   const last=localStorage.getItem('einana-last-diary')||'kyoto';
   map='map-'+last+'.html';
 }
 document.getElementById('mapLink').href=map;
 if(/^kyoto|^osaka[123]/.test(f) && !f.startsWith('map-')){
   localStorage.setItem('einana-last-diary',f.replace('.html',''));
 }
})();
</script>
</body></html>
