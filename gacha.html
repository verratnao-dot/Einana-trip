<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>妖怪ガシャ | えいなな旅行</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;color:#fff;background:radial-gradient(circle at top,#2767a3,#101c43 65%,#0b1731)}a{color:inherit}#stage{position:relative;max-width:610px;width:100%;aspect-ratio:610/665;margin:auto;background:url('gacha-bg.jpg') center/100% 100% no-repeat;overflow:hidden}.quick{position:absolute;top:2%;left:2%;display:flex;gap:4px}.quick a{font-size:12px;background:white;color:#152a4c;border:3px solid #14365c;padding:6px;border-radius:15px;text-decoration:none;font-weight:900}#status{position:absolute;top:3%;right:2%;background:#102a4be8;padding:7px;border:2px solid white;border-radius:14px;font-size:12px;font-weight:900}#mode{position:absolute;top:13%;left:50%;transform:translateX(-50%);display:flex;background:#0b234b;border:2px solid white;border-radius:18px;padding:3px}#mode button{border:0;border-radius:12px;padding:7px;font-weight:900;white-space:nowrap}#mode .active{background:#ffdd50}#oneBtn,#tenBtn{position:absolute;bottom:6.5%;width:43%;height:16%;background:transparent;border:0}#oneBtn{left:3%}#tenBtn{right:3%}#overlay{display:none;position:fixed;inset:0;z-index:999;background:#071631ec;align-items:center;justify-content:center;padding:12px}#overlay.show{display:flex}#scene{position:relative;overflow:hidden;width:min(440px,96vw);min-height:590px;border:6px solid #fff4c5;border-radius:25px;background:radial-gradient(circle at 50% 34%,#6fd1fb,#2656a2 53%,#0c2b61);text-align:center;padding:16px;box-shadow:0 0 35px #ffd65caa}#scene:before{content:'';position:absolute;inset:0;opacity:.2;background:url('gacha-bg.jpg') center/cover;pointer-events:none}#scene>*{position:relative}#phase{font-size:25px;font-weight:1000;color:#ffe581;text-shadow:2px 3px #6b3c16}#capsule{font-size:110px;margin:35px auto 8px;animation:shake .55s infinite alternate}#hero{display:none;margin:20px auto 0;width:190px;height:190px;border:8px ridge #ffdc79;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff8cb,#ffd15f 50%,#c68a25 73%,#8c5d18);align-items:center;justify-content:center;animation:appear .7s both;box-shadow:0 12px 24px #0005;overflow:hidden;position:relative}#hero:after{content:'';position:absolute;inset:8px;border-radius:50%;box-shadow:inset -10px -12px 18px #00000020,inset 12px 10px 18px #ffffff55}#hero img{width:150px;height:150px;object-fit:contain;position:relative;z-index:1;filter:drop-shadow(0 3px 5px #0006)}#speech{display:none;margin:16px auto 0;background:white;color:#173159;border:4px solid #ffd36b;border-radius:22px;padding:16px;font-size:20px;font-weight:900;min-height:75px;line-height:1.5}#joined{display:none;font-weight:1000;color:#fff2a4;font-size:25px;margin:20px 0;text-shadow:2px 3px #723d16}#spinmedal{display:none;width:118px;height:118px;margin:14px auto;border:9px ridge #fbe093;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff8cb,#ffd15f 50%,#c68a25 73%,#8c5d18);align-items:center;justify-content:center;animation:coinspin .7s linear infinite;overflow:hidden;position:relative}#spinmedal img{width:88px;height:88px;object-fit:contain;filter:drop-shadow(0 2px 4px #0005)}#register{display:none;background:#0d376d;border:3px solid #b3eaff;border-radius:16px;padding:13px;font-weight:900;margin:15px 0;line-height:1.5}#next{display:none;margin:20px auto 4px;background:#ffe16e;border:4px solid white;color:#233c61;border-radius:20px;padding:11px 28px;font-size:19px;font-weight:900}#skip{margin:12px auto 0;display:block;background:#183e6e;color:white;border:1px solid #b5d9f3;border-radius:12px;padding:7px 14px}#counter{font-size:13px;color:#d9eaff}.shiny{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,#ffffff55 0,#ffffff10 35%,#ffffff00 60%)}@keyframes shake{from{transform:translateX(-13px) rotate(-13deg)}to{transform:translateX(13px) rotate(13deg)}}@keyframes appear{from{transform:scale(.15);opacity:0}to{transform:scale(1);opacity:1}}@keyframes coinspin{0%{transform:rotateY(0) scale(1)}80%{transform:rotateY(900deg) scale(.65)}100%{transform:rotateY(1080deg) scale(.15);opacity:.15}}@media(prefers-reduced-motion:reduce){#capsule,#hero,#spinmedal{animation-duration:.01ms}}</style></head><body><div id="stage"><nav class="quick"><a href="menu.html">📖 にっき</a><a href="zukan.html">📘 大辞典</a><a href="inventory.html">🎒 もちもの</a></nav><div id="status">💰 <span id="money">0</span>P<br>EXP <span id="exp">0</span></div><div id="mode"><button id="moneyMode" class="active">たびマネー</button><button id="expMode">EXP</button></div><button id="oneBtn" aria-label="1回まわす"></button><button id="tenBtn" aria-label="10回まわす"></button></div><div id="overlay" role="dialog" aria-modal="true" aria-label="ガシャ結果"><div id="scene"><div id="counter"></div><div id="phase">ガシャガシャ…！</div><div id="capsule">🔮</div><div id="hero"><div class="shiny"></div></div><div id="speech"></div><div id="joined"></div><div id="spinmedal"></div><div id="register"></div><button id="next">つぎへ ▶</button><button id="skip">演出をスキップ</button></div></div><script src="yokai-data.js"></script><script src="yokai-shared.js"></script><script>(function(){const M='einana-game-money-v1',E='einana-total-exp-v1',I='einana-gacha-inventory-v2',orbs=[{id:'xp50',name:'けいけんちだま・小',rarity:'ノーマル',img:'xp50.webp'},{id:'xp200',name:'けいけんちだま・中',rarity:'レア',img:'xp200.webp'},{id:'xp500',name:'けいけんちだま・大',rarity:'超レア',img:'xp500.webp'},{id:'xp1000',name:'けいけんちだま・極',rarity:'神レア',img:'xp1000.webp'}],plush={id:'couple_plush',name:'えいななペアぬいぐるみ',rarity:'超レア',img:'couple_plush.webp'};let mode='money',queue=[],current=0,timers=[],busy=false;const $=id=>document.getElementById(id),num=k=>Number(localStorage.getItem(k)||0)||0;function refresh(){$('money').textContent=num(M).toLocaleString();$('exp').textContent=num(E).toLocaleString();$('moneyMode').classList.toggle('active',mode==='money');$('expMode').classList.toggle('active',mode==='exp')}function pick(){const chance=Math.random();if(chance<.035)return {orb:plush};if(chance<.225)return {orb:orbs[Math.floor(Math.random()*orbs.length)]};const pool=EINANA_YOKAI.filter(y=>!y.legend),weights=pool.map(y=>y.rank==='S'?1:y.rank==='A'?2:y.rank==='B'?3:y.rank==='C'?5:8),sum=weights.reduce((a,b)=>a+b,0);let r=Math.random()*sum;for(let i=0;i<pool.length;i++){r-=weights[i];if(r<0)return {y:pool[i]}}return {y:pool[0]}}function later(fn,ms){timers.push(setTimeout(fn,ms))}function clear(){timers.forEach(clearTimeout);timers=[]}function heroImage(src,alt,size=150){const img=document.createElement('img');img.src=src;img.alt=alt;img.width=size;img.height=size;return img}function hideParts(){['capsule','hero','speech','joined','spinmedal','register','next'].forEach(id=>$(id).style.display='none');$('hero').innerHTML='<div class="shiny"></div>';$('spinmedal').innerHTML=''}function finish(){clear();$('overlay').classList.remove('show');busy=false;refresh()}function next(){clear();if(current>=queue.length){finish();return}const prize=queue[current++];hideParts();$('counter').textContent=`${current} / ${queue.length}`;$('phase').textContent='ガシャガシャ…！';$('capsule').style.display='block';$('capsule').textContent='🔮';$('skip').style.display='block';later(()=>{hideParts();$('phase').textContent='カプセルが ひらいた！';$('hero').style.display='flex';if(prize.y){$('hero').append(heroImage(prize.y.img,prize.y.name));$('speech').textContent=`「${prize.y.line}」`;later(()=>{$('speech').style.display='block';$('phase').textContent=prize.y.name+' が あらわれた！'},600);later(()=>{$('joined').textContent=prize.y.name+' が ともだちになった！';$('joined').style.display='block'},1550);later(()=>{$('spinmedal').append(heroImage(prize.y.img,prize.y.name,88));$('spinmedal').style.display='flex';$('phase').textContent='妖怪メダルが回転！'},2600);later(()=>{EinanaDex.add(prize.y.id);$('spinmedal').style.display='none';$('register').textContent=prize.y.name+' を 妖怪大辞典に登録した！';$('register').style.display='block';$('phase').textContent='📖 大辞典 登録！';$('next').style.display='block'},3550)}else{const orb=prize.orb;$('hero').append(heroImage(orb.img,orb.name,125));$('joined').textContent=orb.name+' を GET！';$('joined').style.display='block';$('phase').textContent='アイテム GET！';$('next').style.display='block'}},850)}function spin(count,cost){if(busy)return;const k=mode==='money'?M:E,n=num(k);if(n<cost){alert(mode==='money'?'たびマネーがたりない！':'けいけんちがたりない！');return}busy=true;localStorage.setItem(k,String(n-cost));queue=Array.from({length:count},pick);current=0;let bag;try{bag=JSON.parse(localStorage.getItem(I)||'{}')}catch(e){bag={}}queue.forEach(p=>{if(p.orb)bag[p.orb.id]=(bag[p.orb.id]||0)+1});localStorage.setItem(I,JSON.stringify(bag));refresh();$('overlay').classList.add('show');next()}$('oneBtn').onclick=()=>spin(1,500);$('tenBtn').onclick=()=>spin(10,4500);$('moneyMode').onclick=()=>{mode='money';refresh()};$('expMode').onclick=()=>{mode='exp';refresh()};$('next').onclick=next;$('skip').onclick=()=>{clear();for(let i=current-1;i<queue.length;i++)if(queue[i].y)EinanaDex.add(queue[i].y.id);finish()};refresh()})();</script></body></html>
