<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>ガチャガチャ</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:#173d24;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}#stage{position:relative;width:100%;max-width:610px;margin:auto;aspect-ratio:610/665;background:url("gacha-bg.jpg?v=2") center/100% 100% no-repeat;overflow:hidden}.gachaBtn{position:absolute;z-index:50;border:0;background:rgba(255,255,255,.001);appearance:none;touch-action:manipulation}#oneBtn{left:3%;bottom:6.5%;width:43%;height:16%}#tenBtn{right:3%;bottom:6.5%;width:43%;height:16%}#status{position:absolute;z-index:60;right:2%;top:2%;padding:5px 10px;border:2px solid #c9ecff;border-radius:18px;background:#102844e8;color:#fff;font-weight:900;font-size:12px}#mode{position:absolute;z-index:60;left:50%;top:13%;transform:translateX(-50%);display:flex;background:#102844e8;border:2px solid white;border-radius:18px;padding:3px}#mode button{border:0;border-radius:13px;padding:6px 9px;font-weight:900}#moneyMode.active,#expMode.active{background:#ffe34c}.quick{position:absolute;z-index:70;left:2%;top:2%;display:flex;gap:4px}.quick a{background:#fff;border:3px solid #19395b;border-radius:18px;padding:7px 9px;color:#17212b;text-decoration:none;font-weight:1000;font-size:12px}#result{display:none;position:fixed;z-index:999;inset:0;background:rgba(0,0,0,.72);align-items:center;justify-content:center;padding:18px}#result.show{display:flex}#card{width:min(420px,94vw);background:linear-gradient(#86ec67,#d9ff9d);border:6px solid white;border-radius:26px;text-align:center;padding:20px;box-shadow:0 8px 30px #0008}#rarity{font-size:30px;font-weight:1000}#itemImg{width:160px;height:160px;object-fit:contain}#itemName{font-size:24px;font-weight:1000}#okBtn{border:3px solid #777;background:white;border-radius:22px;padding:10px 38px;font-weight:1000;font-size:18px}</style></head><body>
<div id="stage"><div class="quick"><a href="menu.html">📖 にっき</a><a href="inventory.html">🎒 もちもの</a><a href="money.html">💰 おかね</a></div><div id="status">💰 <span id="money">0</span>P<br>EXP <span id="exp">0</span></div><div id="mode"><button id="moneyMode" class="active">たびマネー</button><button id="expMode">EXP</button></div><button id="oneBtn" class="gachaBtn" aria-label="1回まわす"></button><button id="tenBtn" class="gachaBtn" aria-label="10回まわす"></button></div>
<div id="result"><div id="card"><div id="rarity"></div><img id="itemImg"><div id="itemName"></div><p id="resultText"></p><button id="okBtn">A OK</button></div></div>
<script>(function(){"use strict";var M="einana-game-money-v1",E="einana-total-exp-v1",I="einana-gacha-inventory-v2",mode="money",items=[{id:'bandage',name:'絆創膏',rarity:'ノーマル',img:'bandage.webp'},{id:'candy',name:'飴ちゃん',rarity:'ノーマル',img:'candy.webp'},{id:'ecobag',name:'エコバッグ',rarity:'ノーマル',img:'ecobag.webp'},{id:'guidebook',name:'ガイドブック',rarity:'ノーマル',img:'guidebook.webp'},{id:'cookie',name:'お土産クッキー',rarity:'レア',img:'cookie.webp'},{id:'ferris_ticket',name:'観覧車チケット',rarity:'レア',img:'ferris_ticket.webp'},{id:'local_drink',name:'ご当地ドリンク',rarity:'レア',img:'local_drink.webp'},{id:'551',name:'551の豚まん',rarity:'Sレア',img:'551.webp'},{id:'kinkaku',name:'金閣寺お守り',rarity:'Sレア',img:'kinkaku.webp'},{id:'kyoto_pouch',name:'京都の和雑貨',rarity:'Sレア',img:'kyoto_pouch.webp'},{id:'hotel_ticket',name:'ホテル宿泊券',rarity:'超レア',img:'hotel_ticket.webp'},{id:'couple_plush',name:'えいななペアぬいぐるみ',rarity:'超レア',img:'couple_plush.webp'},{id:'gold_charm',name:'金の御守り',rarity:'神レア',img:'gold_charm.webp'}];
function el(x){return document.getElementById(x)}function num(k){var v=parseInt(localStorage.getItem(k)||"0",10);return isNaN(v)?0:v}function refresh(){el("money").textContent=num(M).toLocaleString();el("exp").textContent=num(E).toLocaleString();el("moneyMode").className=mode==="money"?"active":"";el("expMode").className=mode==="exp"?"active":""}
function bag(){try{return JSON.parse(localStorage.getItem(I)||"{}")}catch(e){return {}}}function choose(){var r=Math.random(),q=r<.01?"神レア":r<.07?"超レア":r<.22?"Sレア":r<.50?"レア":"ノーマル",p=items.filter(function(x){return x.rarity===q});return p[Math.floor(Math.random()*p.length)]}
function spin(c,cost){var k=mode==="money"?M:E,n=num(k);if(n<cost){alert(mode==="money"?"たびマネーがたりない！":"けいけんちがたりない！");return}localStorage.setItem(k,String(n-cost));var b=bag(),w=[];for(var z=0;z<c;z++){var it=choose();w.push(it);b[it.id]=(b[it.id]||0)+1}localStorage.setItem(I,JSON.stringify(b));refresh();var order={"ノーマル":0,"レア":1,"Sレア":2,"超レア":3,"神レア":4},best=w[0];for(var j=1;j<w.length;j++)if(order[w[j].rarity]>order[best.rarity])best=w[j];el("rarity").textContent=best.rarity+"！";el("itemImg").src=best.img+"?v=2";el("itemName").textContent=best.name;el("resultText").textContent=c===1?"アイテムをGET！":"10個のアイテムをGET！";el("result").className="show"}
el("oneBtn").onclick=function(e){e.preventDefault();spin(1,500)};el("tenBtn").onclick=function(e){e.preventDefault();spin(10,4500)};el("moneyMode").onclick=function(){mode="money";refresh()};el("expMode").onclick=function(){mode="exp";refresh()};el("okBtn").onclick=function(){el("result").className=""};refresh()})();</script></body></html>
