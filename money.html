<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>つかったおかね</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(#54d76c,#b7f08b);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#17212b}
.wrap{max-width:610px;margin:auto;min-height:100vh;padding:18px}
.title{background:#252525;color:#fff;border-radius:25px;padding:12px 22px;font-size:25px;font-weight:1000}
.panel{margin-top:18px;background:#fff9;border:4px solid #fff;border-radius:24px;padding:20px;box-shadow:0 7px 0 #397b48}
.big{text-align:center;font-size:18px;font-weight:900}.big b{display:block;font-size:42px;color:#ffb000;text-shadow:2px 2px #fff}
label{display:block;font-weight:900;margin:18px 0 7px}
input{width:100%;font-size:25px;padding:14px;border:4px solid #2b6cb0;border-radius:16px;background:white}
button,a{display:block;width:100%;margin-top:14px;padding:15px;border:0;border-radius:18px;text-align:center;text-decoration:none;font-size:19px;font-weight:1000}
.add{background:#ff6878;color:#111;box-shadow:0 6px 0 #713456}.gacha{background:#8d62e8;color:white;box-shadow:0 6px 0 #3f2b76}
.back{background:white;color:#222}
.log{margin-top:20px;background:#fff9;border-radius:20px;padding:15px}
.row{display:flex;justify-content:space-between;border-bottom:2px dashed #8ab58e;padding:9px 2px;font-weight:800}
.small{font-size:13px;color:#466}
</style></head>
<body><div class="wrap">
<div class="title">💰 つかったおかね</div>
<div class="panel">
 <div class="big">つかったおかね 合計<b id="spent">0円</b></div>
 <div class="big">いまの たびマネー<b id="money">0P</b></div>
 <label>今回つかった金額</label>
 <input id="amount" inputmode="numeric" pattern="[0-9]*" placeholder="例：2500">
 <button class="add" id="add">A きろくする ＋ たびマネーGET！</button>
</div>
<div class="log"><b>📖 きろく</b><div id="history"></div></div>
<a class="gacha" href="gacha.html">🎰 ガチャガチャへ</a>
<a class="back" href="javascript:history.back()">B もどる</a>
</div>
<script>
(function(){
"use strict";
var MONEY="einana-game-money-v1",SPENT="einana-spent-total-v1",LOG="einana-spent-log-v1";
function n(k){var x=parseInt(localStorage.getItem(k)||"0",10);return isNaN(x)?0:x}
function logs(){try{return JSON.parse(localStorage.getItem(LOG)||"[]")}catch(e){return []}}
function render(){
 document.getElementById("spent").textContent=n(SPENT).toLocaleString()+"円";
 document.getElementById("money").textContent=n(MONEY).toLocaleString()+"P";
 var a=logs(),h=document.getElementById("history");
 h.innerHTML=a.length?a.slice().reverse().map(function(x){return '<div class="row"><span>'+x.date+'</span><span>+'+Number(x.amount).toLocaleString()+'P</span></div>'}).join(""):'<p class="small">まだ記録がないよ！</p>';
}
document.getElementById("add").onclick=function(){
 var input=document.getElementById("amount"),v=parseInt(input.value.replace(/[^0-9]/g,""),10);
 if(!v||v<1){alert("つかった金額を入力してね！");return}
 localStorage.setItem(MONEY,String(n(MONEY)+v));
 localStorage.setItem(SPENT,String(n(SPENT)+v));
 var a=logs();a.push({amount:v,date:new Date().toLocaleDateString("ja-JP")});localStorage.setItem(LOG,JSON.stringify(a));
 input.value="";render();alert(v.toLocaleString()+"円を記録！\\nたびマネー ＋"+v.toLocaleString()+"P！");
};
render();
})();
</script></body></html>
