<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大阪1 MAP</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#172554,#0f172a);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.app{max-width:620px;margin:auto;min-height:100vh;padding-bottom:36px}header{padding:20px;background:linear-gradient(135deg,#2563eb,#7c3aed);border-bottom:4px solid #facc15}h1{margin:0 0 5px;font-size:25px}header p{margin:0;color:#dbeafe}.nav{display:flex;gap:7px;margin:14px}.nav a{flex:1;text-align:center;text-decoration:none;color:#fff;background:#334155;padding:11px 6px;border-radius:12px;font-weight:800;font-size:13px}.card{margin:14px;padding:15px;background:#0b1224e8;border:2px solid #60a5fa;border-radius:18px}h2{font-size:18px;color:#fde047}.q{margin:9px 0;border:1px solid #818cf8;border-radius:14px;background:#1e293b;overflow:hidden}summary{cursor:pointer;padding:13px;font-weight:900;list-style:none}.t{color:#67e8f9;font-size:12px;margin-top:3px}.d{padding:0 13px 14px;color:#dbeafe;line-height:1.6;font-size:14px}.m{margin-top:8px;padding:9px;background:#312e81;border-radius:10px}.route{position:relative;margin:18px 14px 30px;padding-left:45px}.route:before{content:"";position:absolute;left:28px;top:18px;bottom:18px;width:5px;background:#60a5fa;border-radius:9px}.stop{position:relative;background:#172554;border:2px solid #818cf8;border-radius:16px;padding:12px;margin:0 0 14px}.pin{position:absolute;left:-39px;top:10px;width:31px;height:31px;border-radius:50%;background:#facc15;color:#111;display:flex;align-items:center;justify-content:center;font-weight:900;border:3px solid #fff}.stop b{font-size:15px}.stop small{display:block;color:#67e8f9;margin:4px 0 8px}.stop a{display:inline-block;color:#fff;background:#2563eb;text-decoration:none;padding:7px 10px;border-radius:9px;font-size:12px;font-weight:800}.note{font-size:12px;color:#cbd5e1;line-height:1.5}</style>
<style id="einana-common-menu-style">
.gameMenuBtn{position:fixed;right:12px;top:max(12px,env(safe-area-inset-top));z-index:9999;width:54px;height:54px;border-radius:50%;border:3px solid #fff;background:#243b82;color:#fff;font-size:25px;box-shadow:0 4px 12px #0007;display:flex;align-items:center;justify-content:center}
.gameMenuShade{position:fixed;inset:0;background:#0008;z-index:9998;display:none}.gameMenuShade.show{display:block}
.gameMenuPanel{position:absolute;right:12px;top:78px;width:min(290px,86vw);padding:14px;border:4px solid #fff;border-radius:22px;background:linear-gradient(145deg,#46c8ff,#5379ee);box-shadow:0 8px 28px #0008}
.gameMenuTitle{font-size:20px;font-weight:1000;color:#fff;margin:2px 5px 10px;text-shadow:2px 2px #28407c}
.gameMenuGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.gameMenuGrid a{display:block;text-decoration:none;text-align:center;padding:14px 6px;border:3px solid #fff;border-radius:15px;background:#fff6c9;color:#172554;font-weight:1000;box-shadow:0 3px #5a66a5}
.gameMenuGrid a:nth-child(2){background:#ffd2ec}.gameMenuGrid a:nth-child(3){background:#d7f7ff}.gameMenuGrid a:nth-child(4){background:#d9ffd5}
.gameMenuClose{width:100%;margin-top:10px;padding:10px;border:0;border-radius:13px;background:#26365f;color:#fff;font-weight:900}
</style>
</head><body><div class="app"><header><h1>🗺️ 大阪1 MAP</h1><p>にっきの順番どおりの専用マップ</p></header><div class="nav"><a href="osaka1.html">← にっきに戻る</a><a href="menu.html">にっき選択</a></div><section class="card"><div class="note">番号順に移動するルートだよ。各「地図で開く」を押すとGoogleマップで正確な場所を確認できるよ。</div></section><div class="route"><div class="stop"><span class="pin">1</span><b>大阪・梅田</b><small>10:00頃〜</small><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=%E5%A4%A7%E9%98%AA%E9%A7%85">📍 地図で開く</a></div><div class="stop"><span class="pin">2</span><b>HEP FIVE</b><small>13:00〜15:00</small><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=HEP%20FIVE%20%E5%A4%A7%E9%98%AA">📍 地図で開く</a></div><div class="stop"><span class="pin">3</span><b>なにわ淀川花火大会・十三側</b><small>16:00頃〜</small><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=%E6%B7%80%E5%B7%9D%E6%B2%B3%E5%B7%9D%E5%85%AC%E5%9C%92%20%E5%8D%81%E4%B8%89%E9%87%8E%E8%8D%89%E5%9C%B0%E5%8C%BA">📍 地図で開く</a></div></div></div>
<button class="gameMenuBtn" id="gameMenuBtn" aria-label="ゲームメニュー">☰</button>
<div class="gameMenuShade" id="gameMenuShade"><div class="gameMenuPanel">
<div class="gameMenuTitle">🎮 ゲームメニュー</div>

</div>

</div></div>
<script id="einana-common-menu-script">
(function(){
 const shade=document.getElementById('gameMenuShade');
 document.getElementById('gameMenuBtn').onclick=()=>shade.classList.add('show');
 document.getElementById('gameMenuClose').onclick=()=>shade.classList.remove('show');
 shade.addEventListener('click',e=>{if(e.target===shade)shade.classList.remove('show')});
 const f=location.pathname.split('/').pop();
 let map='map-kyoto.html';
 if(f.includes('osaka1'))map='map-osaka1.html';
 else if(f.includes('osaka2'))map='map-osaka2.html';
 else if(f.includes('osaka3'))map='map-osaka3.html';
 else if(f==='gacha.html'||f==='inventory.html'){
   const last=localStorage.getItem('einana-last-diary')||'kyoto';
   map='map-'+last+'.html';
 }
 document.getElementById('mapLink').href=map;
 if(/^kyoto|^osaka[123]/.test(f) && !f.startsWith('map-')){
   localStorage.setItem('einana-last-diary',f.replace('.html',''));
 }
})();
</script>
</body></html>
