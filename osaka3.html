(function(){'use strict';
const Q=window.QUESTS,DAY=window.DAY,NAME=window.DIARY_NAME;
const E='einana-total-exp-v1',M='einana-game-money-v1',S='einana-spent-total-v1',P='einana-memory-v1:'+NAME+':',DB='einana-memory-images-v1';
let selected=0,db=null,photoToken=0;const $=id=>document.getElementById(id),num=k=>Math.max(0,Number(localStorage.getItem(k)||0)||0),fmt=x=>x.toLocaleString('ja-JP');
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(window._toastTimeout);window._toastTimeout=setTimeout(()=>$('toast').classList.remove('show'),2400)}
function refresh(){const exp=num(E),lv=Math.floor(exp/500)+1,remaining=500-exp%500; $('exp').textContent=fmt(exp);$('coin').textContent=fmt(num(M))+'P';$('spent').textContent=fmt(num(S))+'円';for(const i of ['1','2']){$('lv'+i).textContent='Lv '+lv;$('until'+i).textContent='つぎまで '+remaining+' EXP';$('bar'+i).style.width=(exp%500/500*100)+'%'}}
function picture(i){return window.PICTURES[i]}
function select(i){selected=Math.max(0,Math.min(Q.length-1,i));const token=++photoToken,q=Q[selected];document.querySelectorAll('.qbtn').forEach((b,j)=>{b.classList.toggle('active',j===selected);b.setAttribute('aria-pressed',j===selected?'true':'false')});$('qtitle').textContent=q[1];$('qnum').textContent=selected+1;$('qpicture').src=picture(selected);$('qpicture').alt=q[1]+'のイラスト';$('qtime').textContent=q[2];$('qdesc').textContent=q[3];$('done').checked=localStorage.getItem('einana-quest-cleared:osaka'+DAY+':'+selected)==='1';$('photo').hidden=true;$('photo').removeAttribute('src');$('photoStatus').textContent='📸 2人の思い出写真をGET';if(db){const request=db.transaction('photos').objectStore('photos').get(P+selected);request.onsuccess=()=>{if(token!==photoToken)return;if(request.result){$('photo').src=request.result;$('photo').hidden=false;$('photoStatus').textContent='📸 おもいで記録済み ✓'}}}}
$('list').innerHTML=Q.map((q,i)=>'<button class="qbtn" type="button" data-i="'+i+'" aria-pressed="false"><span class="qno">'+(i+1)+'</span><span class="qico">'+q[0]+'</span><span class="qtxt">'+q[1]+'<small>'+q[2]+'</small></span></button>').join('');document.querySelectorAll('.qbtn').forEach(b=>b.addEventListener('click',()=>select(Number(b.dataset.i))));
$('done').onchange=function(){localStorage.setItem('einana-quest-cleared:osaka'+DAY+':'+selected,this.checked?'1':'0');toast(this.checked?'🎉 クエストクリア！':'未クリアに戻したよ')};
$('record').onclick=()=>{const v=Number($('amount').value);if(!Number.isSafeInteger(v)||v<=0){toast('金額を入力してね');return}localStorage.setItem(M,String(num(M)+v));localStorage.setItem(S,String(num(S)+v));let log=[];try{log=JSON.parse(localStorage.getItem('einana-spent-log-v1')||'[]');if(!Array.isArray(log))log=[]}catch(e){}log.push({date:new Date().toISOString(),amount:v,place:Q[selected][1]});localStorage.setItem('einana-spent-log-v1',JSON.stringify(log));$('amount').value='';refresh();toast('💰 '+fmt(v)+'円記録！ ＋'+fmt(v)+'P')};
$('addPhoto').onclick=()=>$('file').click();$('file').onchange=function(){const f=this.files&&this.files[0],i=selected;if(!f)return;if(!db){toast('写真保存の準備中だよ。もう一度試してね');return}const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);const data=c.toDataURL('image/jpeg',.76),key=P+i,tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(data,key);tx.oncomplete=()=>{if(selected===i)select(i);if(!localStorage.getItem(key+':xp')){localStorage.setItem(key+':xp','1');localStorage.setItem(E,String(num(E)+100));refresh();toast('⭐ EXP +100！')}else toast('📸 写真を更新したよ！')}};im.src=reader.result};reader.readAsDataURL(f);this.value=''};
$('confirm').onclick=()=>select((selected+1)%Q.length);$('back').onclick=()=>location.href='menu.html';$('menuBtn').onclick=()=>$('menu').classList.add('show');$('closeMenu').onclick=()=>$('menu').classList.remove('show');$('menu').onclick=e=>{if(e.target===$('menu'))$('menu').classList.remove('show')};
// Independent map zoom and drag. Only the map illustration transforms, not quest list or controls.
let scale=1,dx=0,dy=0,startX=0,startY=0,drag=false;const map=$('map'),art=$('mapArt');function paint(){const w=map.clientWidth,h=map.clientHeight;dx=Math.max(w*(1-scale),Math.min(0,dx));dy=Math.max(h*(1-scale),Math.min(0,dy));art.style.transform='translate('+dx+'px,'+dy+'px) scale('+scale+')'}function zoom(v){const old=scale;scale=Math.max(1,Math.min(2.6,v));dx=dx*scale/old-map.clientWidth/2*(scale/old-1);dy=dy*scale/old-map.clientHeight/2*(scale/old-1);$('zoom').value=Math.round(scale*100);paint()}$('zoom').oninput=e=>zoom(Number(e.target.value)/100);$('plus').onclick=()=>zoom(scale+.2);$('minus').onclick=()=>zoom(scale-.2);map.onpointerdown=e=>{if(e.target.closest('.mapControl,.mapMenu'))return;drag=true;startX=e.clientX-dx;startY=e.clientY-dy;map.setPointerCapture(e.pointerId)};map.onpointermove=e=>{if(!drag)return;dx=e.clientX-startX;dy=e.clientY-startY;paint()};map.onpointerup=()=>drag=false;map.onpointercancel=()=>drag=false;window.addEventListener('resize',paint);
try{const r=indexedDB.open(DB,1);r.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains('photos'))e.target.result.createObjectStore('photos')};r.onsuccess=e=>{db=e.target.result;select(selected)}}catch(e){}localStorage.setItem('einana-last-diary','osaka'+DAY);select(window.FEATURE_INDEX);refresh();
})();
</script></body></html>
