.gameMenuShade{position:fixed;inset:0;background:#0008;z-index:9998;display:none}.gameMenuShade.show{display:block}

</head><body><div class="app"><header><h1>🌎 大阪2にっき</h1><p>10/18｜USJ 1DAY</p></header><div class="nav"><a href="menu.html">← にっき</a><a href="map-osaka2.html">🗺️ この日のMAP</a><a href="index.html">タイトル</a></div><section class="card"><h2>🎮 クエスト一覧</h2><details class="q"><summary>🌎 USJ<div class="t">10/18 7:00頃〜22:00頃</div></summary><div class="d">ユニバーサル・スタジオ・ジャパンを丸1日遊び尽くす！<div class="m"><b>MISSION</b><br>このクエストを攻略する！</div><div class="m"><b>MEMORY</b><br>2人の思い出写真をGET 📸</div></div></details></section></div><div id="toast" class="toast"></div>
<script>
(function(){
 const PAGE = document.title;
 const PREFIX='einana-memory-v1:';
 const EXPKEY='einana-total-exp-v1';
 const dbName='einana-memory-images-v1';
 let db;
 const req=indexedDB.open(dbName,1);
 req.onupgradeneeded=e=>{ e.target.result.createObjectStore('photos'); };
 req.onsuccess=e=>{db=e.target.result; init();};
 req.onerror=()=>init();

 function key(i){return PREFIX+PAGE+':'+i}
 function exp(){return Number(localStorage.getItem(EXPKEY)||0)}
 function setExp(v){localStorage.setItem(EXPKEY,String(v)); document.querySelectorAll('.expnum').forEach(x=>x.textContent=v)}
 function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
 function savePhoto(k,data,cb){
   if(!db){cb(false);return}
   const tx=db.transaction('photos','readwrite'); tx.objectStore('photos').put(data,k);
   tx.oncomplete=()=>cb(true); tx.onerror=()=>cb(false);
 }
 function getPhoto(k,cb){
   if(!db){cb(null);return}
   const r=db.transaction('photos').objectStore('photos').get(k);
   r.onsuccess=()=>cb(r.result||null); r.onerror=()=>cb(null);
 }
 function compress(file,cb){
   const reader=new FileReader();
   reader.onload=()=>{
     const im=new Image();
     im.onload=()=>{
       let w=im.width,h=im.height,max=1200;
       if(Math.max(w,h)>max){const s=max/Math.max(w,h);w*=s;h*=s}
       const c=document.createElement('canvas');c.width=w;c.height=h;
       c.getContext('2d').drawImage(im,0,0,w,h);
       cb(c.toDataURL('image/jpeg',.78));
     }; im.src=reader.result;
   }; reader.readAsDataURL(file);
 }
 function init(){
   const qs=[...document.querySelectorAll('.q')];
   const bar=document.createElement('div');bar.className='expbar';bar.innerHTML='⭐ TOTAL EXP：<span class="expnum">'+exp()+'</span> EXP';
   document.querySelector('.nav').after(bar);
   qs.forEach((q,i)=>{
     const ms=[...q.querySelectorAll('.m')];
     const m=ms.find(x=>x.textContent.includes('MEMORY')); if(!m)return;
     const k=key(i); m.classList.add('memory'); m.innerHTML='<b>📸 MEMORY</b><br><span class="status">2人の思い出写真をGET</span><br><span class="add">＋ 写真を追加</span><input type="file" accept="image/*" hidden>';
     const inp=m.querySelector('input');
     m.addEventListener('click',e=>{if(e.target.tagName!=='IMG')inp.click()});
     inp.addEventListener('click',e=>e.stopPropagation());
     inp.addEventListener('change',()=>{
       const f=inp.files&&inp.files[0]; if(!f)return;
       compress(f,data=>savePhoto(k,data,ok=>{
         if(!ok){toast('写真を保存できませんでした');return}
         let img=m.querySelector('img'); if(!img){img=document.createElement('img');m.appendChild(img)}
         img.src=data;m.classList.add('done');m.querySelector('.status').textContent='おもいでを記録した！';
         if(!localStorage.getItem(k+':xp')){localStorage.setItem(k+':xp','1');setExp(exp()+100);toast('✨ おもいでGET！ EXP +100');}
         else toast('📸 写真を更新したよ！');
       }));
     });
     getPhoto(k,data=>{if(data){const img=document.createElement('img');img.src=data;m.appendChild(img);m.classList.add('done');m.querySelector('.status').textContent='おもいで記録済み ✓';}})
   });
 }
})();
</script>

<script>
(function(){
 // A different game-like patterned background is chosen once for each diary.
 const pageKey='einana-bg:'+document.title;
 let bg=localStorage.getItem(pageKey);
 if(bg===null){bg=String(Math.floor(Math.random()*7));localStorage.setItem(pageKey,bg)}
 document.body.classList.add('bg'+bg);

 const EXPKEY='einana-total-exp-v1', SPEND='einana-spend-v1', COIN='einana-coin-v1';
 const yen=n=>Number(n||0).toLocaleString('ja-JP');
 const nav=document.querySelector('.nav');
 const w=document.createElement('div');w.className='wallet';
 w.innerHTML='<div><small>⭐ けいけんち</small><strong class="vexp">'+yen(localStorage.getItem(EXPKEY))+'</strong></div><div><small>💰 たびマネー</small><strong class="vcoin">'+yen(localStorage.getItem(COIN))+'P</strong></div><div style="grid-column:1/-1"><small>💴 つかったおかね</small><strong class="vspend">'+yen(localStorage.getItem(SPEND))+'円</strong></div>';
 nav.after(w);
 function refresh(){document.querySelectorAll('.vexp').forEach(e=>e.textContent=yen(localStorage.getItem(EXPKEY)));document.querySelectorAll('.vcoin').forEach(e=>e.textContent=yen(localStorage.getItem(COIN))+'P');document.querySelectorAll('.vspend').forEach(e=>e.textContent=yen(localStorage.getItem(SPEND))+'円')}
 function result(xp,money){const r=document.getElementById('gameResult');r.querySelector('.rxp').textContent='＋'+yen(xp);r.querySelector('.rmoney').textContent=yen(money)+'円';r.querySelector('.rcoin').textContent='＋'+yen(money)+'P';r.classList.add('show')}
 document.getElementById('resultOK').onclick=()=>document.getElementById('gameResult').classList.remove('show');

 document.querySelectorAll('.q').forEach((q,i)=>{
   const d=q.querySelector('.d'); if(!d)return;
   const box=document.createElement('div');box.className='moneybox';
   box.innerHTML='<b>💴 つかったおかね</b><div class="moneyrow"><input inputmode="numeric" pattern="[0-9]*" placeholder="例：3500"><button>記録</button></div>';
   d.appendChild(box);
   box.querySelector('button').onclick=()=>{
     const input=box.querySelector('input');const n=parseInt(String(input.value).replace(/[^0-9]/g,''),10);
     if(!n||n<1)return;
     localStorage.setItem(SPEND,String(Number(localStorage.getItem(SPEND)||0)+n));
     localStorage.setItem(COIN,String(Number(localStorage.getItem(COIN)||0)+n));
     refresh();result(0,n);input.value='';
   };
 });
 // Hook the existing MEMORY toast so XP gain also opens the result screen.
 const obs=new MutationObserver(()=>{
   const t=document.getElementById('toast');
   if(t&&t.classList.contains('show')&&t.textContent.includes('EXP +100')){refresh();result(100,0)}
 });
 const toast=document.getElementById('toast');if(toast)obs.observe(toast,{attributes:true,childList:true,subtree:true});
})();
</script>

   const last=localStorage.getItem('einana-last-diary')||'kyoto';
   map='map-'+last+'.html';
 }
 document.getElementById('mapLink').href=map;
 if(/^kyoto|^osaka[123]/.test(f) && !f.startsWith('map-')){
   localStorage.setItem('einana-last-diary',f.replace('.html',''));
 }
})();
</script>
