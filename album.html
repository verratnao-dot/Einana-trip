<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>えいなな おもいでアルバム</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#82d9f6,#1471b9 52%,#083876);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#112b5a;min-height:100vh}header{background:linear-gradient(110deg,#ffdf77,#ffc1df,#b9eaff);border-bottom:6px solid #fff;text-align:center;padding:24px 10px}h1{margin:0;font-size:clamp(25px,7vw,39px);text-shadow:2px 2px white}header p{margin:7px 0 0;font-weight:900}.app{max-width:740px;margin:auto;padding:12px 12px 100px}.hero{border:5px solid white;border-radius:22px;background:#fffbe9;padding:13px;box-shadow:0 5px #1c6198}.hero strong{font-size:23px;color:#cc448a}.filters{display:flex;overflow-x:auto;gap:8px;padding:14px 0}.filters button{flex-shrink:0;background:#fff;color:#113e81;border:3px solid #fff;border-radius:20px;padding:10px 15px;font-weight:900}.filters button.active{background:#ffe16d;border-color:#b97c25}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo{background:#fff;border:5px solid #fff;border-radius:20px;overflow:hidden;text-align:left;color:#122d5c;box-shadow:0 5px #1e558a;padding:0}.photo img{width:100%;aspect-ratio:1.12;object-fit:cover;display:block;background:#d4ecff}.photo .txt{padding:10px}.photo b{display:block;font-size:15px;line-height:1.3}.photo small{display:block;margin-top:6px;color:#52627a;font-size:12px;font-weight:900}.empty{grid-column:1/-1;background:#fffdf1;border:4px solid white;border-radius:20px;padding:40px 18px;text-align:center;font-weight:900}.note{font-size:12px;background:#d6f2ff;border-radius:14px;padding:10px;margin-top:15px}.overlay{position:fixed;inset:0;background:#071b39e8;z-index:20;display:none;align-items:center;justify-content:center;padding:12px}.overlay.show{display:flex}.detail{width:min(550px,98vw);max-height:90vh;overflow:auto;border:5px solid #fff;border-radius:23px;background:#fff9dc;padding:12px}.detail img{width:100%;max-height:48vh;object-fit:contain;border-radius:14px;background:#c8e7ff}.detail h2{margin:7px 0}.detail label{display:block;margin:9px 0;font-weight:900}.detail input{display:block;width:100%;border:2px solid #94a9c5;border-radius:10px;padding:10px;font-size:16px}.buttons{display:flex;gap:8px}.buttons button,.buttons a{flex:1;text-align:center;border:3px solid #fff;border-radius:16px;background:#234ba5;color:white;padding:11px;font-weight:900}.buttons button:first-child{background:#ef4d94}.nav{position:fixed;bottom:0;left:0;right:0;background:#0b3067ed;display:flex;gap:6px;padding:9px 6px calc(9px + env(safe-area-inset-bottom))}.nav a{flex:1;text-decoration:none;text-align:center;background:#fff5d8;border-radius:14px;padding:11px 1px;color:#122c5a;font-weight:900;font-size:12px}</style></head><body><header><h1>📸 えいなな思い出アルバム</h1><p>ふたりの旅のたからもの ✨</p></header><main class="app"><div class="hero"><strong id="count">0枚の思い出</strong><div>にっきのクエストで保存した写真が、日付・場所といっしょにここへ集まるよ！</div></div><div class="filters" id="filters"><button class="active" data-filter="all">📚 すべて</button><button data-filter="kyoto">🌸 京都</button><button data-filter="osaka1">🎆 大阪1</button><button data-filter="osaka2">🎢 大阪2</button><button data-filter="osaka3">🐠 大阪3</button></div><section class="grid" id="grid"><div class="empty">📷 思い出を読み込み中…</div></section><div class="note">日付は旅行の予定日を表示しているよ（写真を撮った正確な日時ではないよ）。場所や日付が違っていたら写真を開いて編集できるよ。写真はこの端末のブラウザ内に保存されているため、別の端末やブラウザでは表示されない場合があるよ。</div></main><div class="overlay" id="overlay"><div class="detail"><img id="big" alt="思い出写真"><h2 id="heading">思い出</h2><label>📅 日付<input type="date" id="editDate"></label><label>📍 場所<input type="text" id="editPlace" maxlength="90"></label><div class="buttons"><button id="save">💾 保存</button><button id="close">Ⓑ とじる</button></div></div></div><nav class="nav"><a href="menu.html">📖 にっき</a><a href="gacha.html">🎰 ガチャ</a><a href="inventory.html">🎒 もちもの</a><a href="money.html">💰 おかね</a></nav><script src="album-data.js"></script><script>
(()=>{'use strict';const DB='einana-memory-images-v1',PREFIX='einana-memory-v1:',META=window.EINANA_ALBUM_META||{};const $=id=>document.getElementById(id);let rows=[],filter='all',selected=null;const override=k=>{try{return JSON.parse(localStorage.getItem('einana-album-meta:'+k)||'null')||{}}catch(e){return {}}};function metadata(k){let v=META[k]||{},o=override(k);return {day:v.day||'other',date:o.date||v.date||'',place:o.place||v.place||'思い出の場所',diary:v.diary||'旅のにっき'}}function render(){const view=rows.filter(x=>filter==='all'||metadata(x.key).day===filter).sort((a,b)=>{let m=metadata(a.key),n=metadata(b.key);return m.date.localeCompare(n.date)||a.key.localeCompare(b.key)});$('count').textContent=rows.length+'枚の思い出';$('grid').innerHTML='';if(!view.length){$('grid').innerHTML='<div class="empty">📷 まだこのにっきに写真がないよ！<br>クエストの「＋写真を追加」から保存してね💕</div>';return}view.forEach(x=>{let m=metadata(x.key),b=document.createElement('button');b.className='photo';let im=document.createElement('img');im.src=x.src;im.loading='lazy';im.alt=m.place;let div=document.createElement('div');div.className='txt';let title=document.createElement('b');title.textContent='📍 '+m.place;let small=document.createElement('small');small.textContent='📅 '+(m.date?m.date.replaceAll('-','/'):'日付未設定')+'　'+m.diary;div.append(title,small);b.append(im,div);b.onclick=()=>openPhoto(x.key);$('grid').append(b)})}function openPhoto(key){let x=rows.find(x=>x.key===key);if(!x)return;selected=key;let m=metadata(key);$('big').src=x.src;$('heading').textContent=m.diary;$('editDate').value=m.date;$('editPlace').value=m.place;$('overlay').classList.add('show')};$('save').onclick=()=>{if(!selected)return;let place=$('editPlace').value.trim(),date=$('editDate').value;if(!place){alert('場所を入力してね');return}try{localStorage.setItem('einana-album-meta:'+selected,JSON.stringify({place,date}))}catch(e){alert('保存できなかったよ');return}$('overlay').classList.remove('show');render()};$('close').onclick=()=>$('overlay').classList.remove('show');$('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').classList.remove('show')};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});try{const r=indexedDB.open(DB,1);r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('photos'))db.createObjectStore('photos')};r.onerror=()=>{$('grid').innerHTML='<div class="empty">写真を読み込めなかったよ。Safariの設定を確認してね。</div>'};r.onsuccess=e=>{let db=e.target.result,tx=db.transaction('photos','readonly'),cur=tx.objectStore('photos').openCursor();cur.onsuccess=e=>{const c=e.target.result;if(c){if(typeof c.key==='string'&&c.key.startsWith(PREFIX)&&typeof c.value==='string'&&c.value.startsWith('data:image/'))rows.push({key:c.key,src:c.value});c.continue()}else render()};cur.onerror=()=>{$('grid').innerHTML='<div class="empty">写真を読み込めなかったよ。</div>'}}}catch(e){$('grid').innerHTML='<div class="empty">写真の保存機能を使えないブラウザだよ。</div>'}})();
</script></body></html>
