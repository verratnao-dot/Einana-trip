<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>もちもの</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:linear-gradient(#78d8f6,#25ade2);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#14213d;min-height:100vh}header{background:#fff;border-bottom:7px solid #f6d633;padding:42px 22px 25px;font-size:34px;font-weight:1000}main{max-width:650px;margin:auto;padding:18px 12px 100px}.notice{background:#c8efff;border:5px solid white;border-radius:25px;padding:14px;font-size:18px;font-weight:1000;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.item{position:relative;min-height:205px;background:#c9efff;border:5px solid white;border-radius:22px;box-shadow:0 6px 0 #256b91;padding:27px 5px 9px;text-align:center;color:#14213d}.item img{width:110px;height:110px;object-fit:contain;display:block;margin:auto}.name{font-size:14px;font-weight:1000;line-height:1.15}.rarity{position:absolute;left:6px;top:6px;background:white;border-radius:13px;padding:2px 7px;font-size:11px;font-weight:1000}.count{position:absolute;right:7px;bottom:5px;color:white;font-size:25px;font-weight:1000;text-shadow:2px 2px #17395b}.detail{margin-top:18px;background:#ffe779;border:5px solid white;border-radius:24px;padding:15px;min-height:165px}.detail img{width:110px;height:110px;object-fit:contain;float:left;margin-right:12px}.detail h2{margin:3px 0}.detail button{background:#ff8fac;border:3px solid #7c3151;border-radius:15px;padding:9px 13px;font-weight:1000}.nav{position:fixed;z-index:99;bottom:0;left:0;right:0;background:#153d61ed;display:flex;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}.nav a{flex:1;background:#fff;border-radius:15px;padding:12px 3px;text-align:center;text-decoration:none;color:#17212b;font-weight:1000;font-size:13px}.empty{grid-column:1/-1;background:#fff9;padding:30px;border-radius:20px;text-align:center;font-weight:900}@media(max-width:390px){.item{min-height:180px}.item img{width:90px;height:90px}.name{font-size:12px}}</style></head><body>
<header>もちもの</header><main><div class="notice">🎒 ガチャでGETしたアイテムだけ表示</div><div class="grid" id="grid"></div><div class="detail" id="detail">アイテムをタップしてね！</div></main>
<nav class="nav"><a href="menu.html">📖 にっき</a><a href="gacha.html">🎰 ガチャ</a><a href="money.html">💰 おかね</a></nav>
<script>(function(){"use strict";var K="einana-gacha-inventory-v2",E="einana-total-exp-v1";var A=[{id:'bandage',name:'絆創膏',rarity:'ノーマル',img:'bandage.webp',xp:0},{id:'candy',name:'飴ちゃん',rarity:'ノーマル',img:'candy.webp',xp:0},{id:'ecobag',name:'エコバッグ',rarity:'ノーマル',img:'ecobag.webp',xp:0},{id:'guidebook',name:'ガイドブック',rarity:'ノーマル',img:'guidebook.webp',xp:0},{id:'cookie',name:'お土産クッキー',rarity:'レア',img:'cookie.webp',xp:0},{id:'ferris_ticket',name:'観覧車チケット',rarity:'レア',img:'ferris_ticket.webp',xp:0},{id:'local_drink',name:'ご当地ドリンク',rarity:'レア',img:'local_drink.webp',xp:0},{id:'551',name:'551の豚まん',rarity:'Sレア',img:'551.webp',xp:0},{id:'kinkaku',name:'金閣寺お守り',rarity:'Sレア',img:'kinkaku.webp',xp:0},{id:'kyoto_pouch',name:'京都の和雑貨',rarity:'Sレア',img:'kyoto_pouch.webp',xp:0},{id:'hotel_ticket',name:'ホテル宿泊券',rarity:'超レア',img:'hotel_ticket.webp',xp:0},{id:'couple_plush',name:'えいななペアぬいぐるみ',rarity:'超レア',img:'couple_plush.webp',xp:0},{id:'gold_charm',name:'金の御守り',rarity:'神レア',img:'gold_charm.webp',xp:0},{id:'xp50',name:'けいけんちだま・小',rarity:'ノーマル',img:'xp50.webp',xp:50},{id:'xp200',name:'けいけんちだま・中',rarity:'レア',img:'xp200.webp',xp:200},{id:'xp500',name:'けいけんちだま・大',rarity:'超レア',img:'xp500.webp',xp:500},{id:'xp1000',name:'けいけんちだま・極',rarity:'神レア',img:'xp1000.webp',xp:1000}];
function bag(){try{return JSON.parse(localStorage.getItem(K)||"{}")}catch(e){return {}}}function save(v){localStorage.setItem(K,JSON.stringify(v))}
function qty(v,i){return Number(v[i.id]||v[i.img.replace(".webp","")]||0)}
function render(){var v=bag(),o=A.filter(function(i){return qty(v,i)>0}),g=document.getElementById("grid");if(!o.length){g.innerHTML='<div class="empty">まだアイテムがないよ！<br>ガチャを回してGETしよう🎰</div>';return}g.innerHTML=o.map(function(i){return '<button class="item" data-id="'+i.id+'"><span class="rarity">'+i.rarity+'</span><img src="'+i.img+'?v=2" alt=""><span class="name">'+i.name+'</span><span class="count">×'+qty(v,i)+'</span></button>'}).join("");Array.prototype.forEach.call(g.querySelectorAll(".item"),function(b){b.onclick=function(){show(b.getAttribute("data-id"))}})}
function show(id){var i=A.filter(function(x){return x.id===id})[0],v=bag();if(!i)return;document.getElementById("detail").innerHTML='<img src="'+i.img+'?v=2"><h2>'+i.name+'</h2><b>'+i.rarity+'</b><p>もっているかず：'+qty(v,i)+'</p>'+(i.xp?'<button id="use">A つかう（EXP +'+i.xp+'）</button>':'')+'<div style="clear:both"></div>';if(i.xp)document.getElementById("use").onclick=function(){var b=bag();if(!qty(b,i))return;b[i.id]=(b[i.id]||0)-1;save(b);var x=parseInt(localStorage.getItem(E)||"0",10)||0;localStorage.setItem(E,String(x+i.xp));alert("けいけんち ＋"+i.xp+"！");render();show(id)}}
render()})();</script></body></html>
