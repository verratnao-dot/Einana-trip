<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>もちもの</title><style>
*{box-sizing:border-box}body{margin:0;background:#58c4f4;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN",sans-serif;color:#222}
.gameMenuBtn{position:fixed;right:12px;top:max(12px,env(safe-area-inset-top));z-index:9999;width:52px;height:52px;border-radius:50%;border:3px solid #fff;background:#2251a5;color:#fff;font-size:24px;box-shadow:0 4px 12px #0007}.gameShade{display:none;position:fixed;inset:0;background:#0009;z-index:9998}.gameShade.show{display:block}.gamePanel{position:absolute;right:12px;top:76px;width:270px;padding:12px;border:4px solid white;border-radius:20px;background:#55bdf0}.gamePanel a{display:inline-block;width:47%;margin:1%;padding:13px 3px;border-radius:13px;background:#fff;text-align:center;color:#14224d;text-decoration:none;font-weight:900}.gamePanel button{width:100%;margin-top:8px;padding:9px;border:0;border-radius:12px;background:#27375f;color:white;font-weight:900}

header{background:#fff;border-bottom:6px solid #f3d33b;padding:17px 20px;font-size:29px;font-weight:1000}.wrap{max-width:800px;margin:auto;padding:13px}.tabs{background:#bceeff;border:4px solid white;border-radius:17px;padding:10px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.it{position:relative;min-height:125px;background:#8edfff;border:3px solid #e6faff;border-radius:15px;text-align:center;padding:10px 5px}.art{font-size:48px}.cnt{position:absolute;right:7px;bottom:5px;font-size:22px;color:white;font-weight:1000;-webkit-text-stroke:1px #222}.badge{position:absolute;left:4px;top:4px;background:white;border-radius:8px;padding:3px 5px;font-size:9px;font-weight:900}.detail{margin-top:14px;background:#ffe35d;border:5px solid white;border-radius:20px;padding:16px;min-height:175px}.use{background:#72d8ff;border:3px solid white;border-radius:15px;padding:10px 20px;font-weight:1000;font-size:17px}.xp{font-size:24px;font-weight:1000;color:#164c9e}@media(min-width:650px){.grid{grid-template-columns:repeat(5,1fr)}}

.inventoryHero{position:relative;width:100%;aspect-ratio:16/9;background:url("inventory-bg.png") center/cover no-repeat;border-bottom:5px solid #fff;box-shadow:0 5px 15px #0003}.inventoryHero .hint{position:absolute;right:2%;bottom:2%;background:#ffffffdd;border-radius:14px;padding:6px 10px;font-weight:900;font-size:12px}.wrap{padding-top:10px!important}@media(max-width:600px){.inventoryHero{aspect-ratio:9/7;background-size:cover;background-position:25% center}}
</style></head><body><header>もちもの</header><div class="inventoryHero"><div class="hint">↓ アイテムをタップして使えるよ</div></div><div class="wrap"><div class="tabs">すべて　🍙 たべもの　🎟️ けん　💎 おもいで　🔑 その他</div><div class="grid" id="grid"></div><div class="detail" id="detail">アイテムをタップしてね！</div></div>
<button class="gameMenuBtn" id="gm">☰</button><div class="gameShade" id="gs"><div class="gamePanel"><a href="inventory.html">🎒 もちもの</a><a href="gacha.html">🎰 ガチャ</a><a href="menu.html">📖 にっき</a><a href="map-kyoto.html">🗺️ MAP</a><button onclick="gs.classList.remove('show')">B もどる</button></div></div>
<script>
const MONEY='einana-game-money-v1', EXP='einana-total-exp-v1', INV='einana-gacha-inventory-v2';
const ITEMS=[
 {id:'snack',n:'おやつ券',r:'ノーマル',col:'silver',icon:'🍭',d:'旅行中のおやつタイムに使える券。'},
 {id:'photo',n:'写真ポーズ指定券',r:'ノーマル',col:'silver',icon:'📸',d:'次の写真のポーズを決められる券。'},
 {id:'drink',n:'ドリンク券',r:'ノーマル',col:'silver',icon:'🥤',d:'休憩タイムに使えるドリンク券。'},
 {id:'food',n:'食べ歩き券',r:'レア',col:'blue',icon:'🍡',d:'食べ歩きで好きなものを選べる券。'},
 {id:'wish',n:'お願いできる券',r:'レア',col:'blue',icon:'💌',d:'相手にかわいいお願いを1つできる券。'},
 {id:'date',n:'デート先決定券',r:'Sレア',col:'red',icon:'🎡',d:'次のデート先を決められる特別な券。'},
 {id:'key',n:'思い出キーホルダー',r:'Sレア',col:'red',icon:'🔑',d:'旅の思い出を残す記念アイテム。'},
 {id:'reward',n:'スペシャルごほうび券',r:'超レア',col:'gold',icon:'👑',d:'2人だけの特別なごほうび券。'},
 {id:'night',n:'大阪の夜景キーホルダー',r:'神レア',col:'black',icon:'🌃',d:'夜景の思い出がつまった最高レアアイテム。'},
 {id:'xp50',n:'けいけんちだま・小',r:'ノーマル',col:'silver',icon:'🔵',xp:50,d:'使うと けいけんち +50。'},
 {id:'xp200',n:'けいけんちだま・中',r:'レア',col:'blue',icon:'🔥',xp:200,d:'使うと けいけんち +200。'},
 {id:'xp500',n:'けいけんちだま・大',r:'超レア',col:'gold',icon:'🔮',xp:500,d:'使うと けいけんち +500。'},
 {id:'xp1000',n:'けいけんちだま・極',r:'神レア',col:'black',icon:'🌈',xp:1000,d:'使うと けいけんち +1000。'}
];
function num(k){return Number(localStorage.getItem(k)||0)}
function setn(k,v){localStorage.setItem(k,String(Math.max(0,v)))}
function inv(){try{return JSON.parse(localStorage.getItem(INV)||'{}')}catch(e){return {}}}
function saveInv(v){localStorage.setItem(INV,JSON.stringify(v))}
function pick(){
 let x=Math.random(),r=x<.01?'神レア':x<.07?'超レア':x<.22?'Sレア':x<.50?'レア':'ノーマル';
 let p=ITEMS.filter(i=>i.r===r); return p[Math.floor(Math.random()*p.length)]
}

function render(){let v=inv(),g=document.getElementById('grid');g.innerHTML='';ITEMS.forEach(i=>{let c=v[i.id]||0;if(!c)return;let e=document.createElement('div');e.className='it';e.innerHTML='<span class="badge">'+i.r+'</span><div class="art">'+i.icon+'</div><b>'+i.n+'</b><span class="cnt">'+c+'</span>';e.onclick=()=>detail(i,c);g.appendChild(e)});if(!g.children.length)g.innerHTML='<p>まだアイテムがないよ！ガチャを回してGETしよう🎰</p>'}
function detail(i,c){let use=i.xp?'<p class="xp">使うと EXP +'+i.xp+'</p><button class="use" onclick="useXp(\''+i.id+'\')">A つかう</button>':'';document.getElementById('detail').innerHTML='<h2>'+i.icon+' '+i.n+'</h2><b>'+i.r+'　もっているかず '+c+'</b><p>'+i.d+'</p>'+use}
function useXp(id){let v=inv(),i=ITEMS.find(x=>x.id===id);if(!i||!i.xp||!(v[id]>0))return;v[id]--;saveInv(v);setn(EXP,num(EXP)+i.xp);alert('✨ けいけんち +'+i.xp+'！');render();document.getElementById('detail').innerHTML='けいけんちが増えた！'}
document.getElementById('gm').onclick=()=>document.getElementById('gs').classList.add('show');render();
</script></body></html>
