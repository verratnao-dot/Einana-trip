<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>もちもの</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#65cdf7,#36aee8);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN",sans-serif;color:#17223d}
header{background:#fff;border-bottom:6px solid #f2d13b;padding:17px 20px;font-size:30px;font-weight:1000}.wrap{max-width:760px;margin:auto;padding:12px}
.tabs{background:#c8efff;border:4px solid white;border-radius:18px;padding:10px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.it{position:relative;min-height:130px;background:#bcecff;border:3px solid #fff;border-radius:15px;padding:8px;text-align:center;box-shadow:0 4px #168ac2}

.detail img{width:120px;height:120px;object-fit:contain;float:left;margin-right:14px}.use{padding:10px 20px;border:3px solid #fff;border-radius:14px;background:#6dd7ff;font-weight:1000}
.menu{position:fixed;right:12px;top:12px;width:52px;height:52px;border-radius:50%;border:3px solid #fff;background:#2251a5;color:#fff;font-size:24px;z-index:9}@media(min-width:650px){.grid{grid-template-columns:repeat(5,1fr)}}

function inv(){try{return JSON.parse(localStorage.getItem(INV)||'{}')}catch(e){return {}}}
function save(v){localStorage.setItem(INV,JSON.stringify(v))} function num(k){return Number(localStorage.getItem(k)||0)} function setn(k,v){localStorage.setItem(k,String(v))}
function render(){const v=inv(),g=document.getElementById('grid');g.innerHTML='';ITEMS.forEach(i=>{const c=v[i.id]||0;if(!c)return;let e=document.createElement('div');e.className='it';e.innerHTML=`<span class="badge">${i.rarity}</span><img src="${i.img}" alt=""><b>${i.name}</b><span class="cnt">×${c}</span>`;e.onclick=()=>show(i,c);g.appendChild(e)});if(!g.children.length)g.innerHTML='<p>まだアイテムがないよ！🎰 ガチャを回してGETしよう！</p>'}
function show(i,c){document.getElementById('detail').innerHTML=`<img src="${i.img}"><h2>${i.name}</h2><b>${i.rarity}　もっているかず ${c}</b><p>${i.xp?'使うと けいけんち +'+i.xp:'旅の思い出ガチャでGETしたアイテム。'}</p>${i.xp?`<button class="use" onclick="useXp('${i.id}')">A つかう</button>`:''}`;}
function useXp(id){let v=inv(),i=ITEMS.find(x=>x.id===id);if(!i||!i.xp||!(v[id]>0))return;v[id]--;save(v);setn(EXP,num(EXP)+i.xp);alert('✨ けいけんち +'+i.xp+'！');render();detail.innerHTML='けいけんちが増えた！'}
render();
</script></body></html>
