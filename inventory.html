<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>もちもの・妖怪の仲間</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#7ad9fa,#1260b3);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#102a59;min-height:100vh}header{padding:22px 15px;background:linear-gradient(#fff4a9,#ffcf60);border-bottom:6px solid #d69439;text-align:center}h1{margin:0;font-size:30px}main{max-width:680px;margin:auto;padding:12px 12px 110px}.info{background:#ffffffeb;border:4px solid #fff;border-radius:18px;padding:12px;font-weight:900}.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1;border:3px solid white;border-radius:18px;background:#184b9d;color:white;padding:12px 3px;font-weight:900}.tabs button.active{background:#ffdd64;color:#1c3362}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.item{position:relative;background:linear-gradient(#fff,#c2edff);border:4px solid white;border-radius:19px;box-shadow:0 4px #14689d;padding:21px 3px 10px;text-align:center;color:#12295a;font-weight:900;min-width:0}.item img{display:block;width:100%;max-width:120px;height:105px;object-fit:contain;margin:auto}.item small{font-size:10px;display:block}.item b{display:block;font-size:13px}.rarity{position:absolute;top:4px;left:5px;background:#ffe56d;border-radius:12px;font-size:10px;padding:2px 6px}.qty{position:absolute;right:6px;bottom:5px;background:#234d9e;color:white;border-radius:10px;padding:2px 5px}.detail{background:linear-gradient(#fff9c9,#fff);border:5px solid #fff;border-radius:24px;padding:14px;margin-top:15px;min-height:120px}.detail img{width:120px;height:125px;object-fit:contain;float:left;margin-right:10px}.detail h2{margin:2px}.detail button{background:#f54791;color:white;border:3px solid #fff;border-radius:17px;padding:10px;font-weight:900}.empty{grid-column:1/-1;text-align:center;background:#fff9;padding:30px;border-radius:18px}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:5px;padding:9px 6px calc(9px + env(safe-area-inset-bottom));background:#0b3469ed}.nav a{flex:1;text-align:center;background:#fff6d8;padding:12px 0;border-radius:14px;font-weight:900;font-size:12px;text-decoration:none;color:#172c5a}</style></head><body><header><h1>🎒 もちもの</h1>えいなな旅行の妖怪とアイテム</header><main><div class="info">👻 妖怪は20体！ガチャで出会った仲間がここに並ぶよ。<br>⭐ 経験値玉は「つかう」でEXPが増える！</div><div class="tabs"><button data-tab="yokai" class="active">👻 妖怪</button><button data-tab="xp">⭐ 経験値玉</button><button data-tab="legacy">🎁 以前のアイテム</button></div><div class="grid" id="grid"></div><div class="detail" id="detail">仲間をタップすると詳細が見られるよ！</div></main><nav class="nav"><a href="menu.html">📖 にっき</a><a href="gacha.html">🎰 ガチャ</a><a href="album.html">📸 アルバム</a><a href="money.html">💰 おかね</a></nav><script src="yokai-data.js"></script><script>
(()=>{'use strict';const A=window.EINANA_GACHA_ITEMS||[],K='einana-gacha-inventory-v2',E='einana-total-exp-v1';const old=[['bandage','絆創膏','bandage.webp'],['candy','飴ちゃん','candy.webp'],['ecobag','エコバッグ','ecobag.webp'],['guidebook','ガイドブック','guidebook.webp'],['cookie','お土産クッキー','cookie.webp'],['ferris_ticket','観覧車チケット','ferris_ticket.webp'],['local_drink','ご当地ドリンク','local_drink.webp'],['551','551の豚まん','551.webp'],['kinkaku','金閣寺お守り','kinkaku.webp'],['kyoto_pouch','京都の和雑貨','kyoto_pouch.webp'],['hotel_ticket','ホテル宿泊券','hotel_ticket.webp'],['couple_plush','ペアぬいぐるみ','couple_plush.webp'],['gold_charm','金の御守り','gold_charm.webp']].map(x=>({id:x[0],name:x[1],img:x[2],kind:'legacy',rarity:'旅アイテム',description:'以前のガチャで集めたアイテム'}));let tab='yokai';const $=x=>document.getElementById(x);function bag(){try{return JSON.parse(localStorage.getItem(K)||'{}')||{}}catch(e){return {}}}function render(){const b=bag(),pool=(tab==='legacy'?old:A.filter(x=>x.kind===tab)).filter(x=>(Number(b[x.id])||0)>0);$('grid').innerHTML=pool.length?pool.map(x=>'<button class="item" data-id="'+x.id+'"><span class="rarity">'+x.rarity+'</span><img src="'+x.img+'" loading="lazy"><b>'+x.name+'</b><small>'+x.description+'</small><span class="qty">×'+b[x.id]+'</span></button>').join(''):'<div class="empty">まだここには何もないよ！<br>ガチャでGETしよう✨</div>';$('grid').querySelectorAll('button').forEach(el=>el.onclick=()=>detail(el.dataset.id))}function detail(id){let x=A.concat(old).find(x=>x.id===id),b=bag();if(!x)return;$('detail').innerHTML='<img src="'+x.img+'"><h2>'+x.name+'</h2><b>'+x.rarity+'</b><p>'+x.description+'</p><p>もっているかず：'+(b[id]||0)+'</p>'+(x.xp?'<button id="use">Ⓐ つかう（EXP +'+x.xp+'）</button>':'')+'<div style="clear:both"></div>';let btn=$('use');if(btn)btn.onclick=()=>{let v=bag();if(!(v[id]>0))return;let exp=Math.max(0,Number(localStorage.getItem(E)||0)||0);try{v[id]--;localStorage.setItem(K,JSON.stringify(v));localStorage.setItem(E,String(exp+x.xp))}catch(e){alert('保存できなかったよ');return}render();detail(id);alert('⭐ EXP +'+x.xp+'！')}}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));$('detail').textContent='アイテムをタップしてね！';render()});render()})();
</script></body></html>
